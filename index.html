<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light dark;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Mizan Accounts</title>
<meta name="description" content="Bilingual company accounting: clients, projects, invoices, income, expenses, VAT and reports, in JOD.">
<style>
  :root{
    --canvas:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eceef1;
    --ink:#171a21; --ink-soft:#5a616d; --ink-faint:#949ba7;
    --line:#e8eaee; --line-2:#dfe2e7;
    --accent:#3b53d6; --accent-2:#6274e0; --accent-3:#aeb6e8; --accent-4:#2739a3; --accent-soft:#eaecfb;
    --dark:#0f1218; --dark-2:#171b24; --on-dark:#eef0f5; --on-dark-soft:#828b9e; --dark-line:#242a36;
    --pos:#158a57; --pos-soft:#e6f2ec; --neg:#bd4740; --neg-soft:#f7e9e8; --warn:#946a17; --warn-soft:#f6efdd;
    --pill:#171a21;
    --chart-inc:#8ea2ff; --chart-exp:#e0938a;
    --r-card:8px; --r-mid:6px; --r-sm:5px;
    --shadow:0 1px 2px rgba(20,24,34,.05), 0 8px 24px rgba(20,24,34,.05);
    --shadow-sm:0 1px 1px rgba(20,24,34,.04);
    --shadow-lift:0 2px 4px rgba(20,24,34,.06), 0 16px 40px rgba(20,24,34,.09);
    --disp:"Space Grotesk","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
    --font:"Hanken Grotesk","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,monospace;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  :root[data-theme="dark"]{
    --canvas:#0a0c10; --surface:#13161d; --surface-2:#181c24; --surface-3:#212632;
    --ink:#e8ebf1; --ink-soft:#98a0ae; --ink-faint:#626a79;
    --line:#212632; --line-2:#2a303d;
    --accent:#7488e6; --accent-2:#8394e6; --accent-3:#37436a; --accent-4:#aab6ee; --accent-soft:#1b2338;
    --dark:#12151d; --dark-2:#191d27; --on-dark:#eef0f5; --on-dark-soft:#828b9e; --dark-line:#252b38;
    --pos:#3aa877; --pos-soft:#12271d; --neg:#d16f68; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2a2415;
    --pill:#e8ebf1; --chart-inc:#8ea2ff; --chart-exp:#e0938a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.4);
    --shadow-sm:0 1px 1px rgba(0,0,0,.4); --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){
    --canvas:#0a0c10; --surface:#13161d; --surface-2:#181c24; --surface-3:#212632;
    --ink:#e8ebf1; --ink-soft:#98a0ae; --ink-faint:#626a79; --line:#212632; --line-2:#2a303d;
    --accent:#7488e6; --accent-4:#aab6ee; --accent-soft:#1b2338; --dark:#12151d;
    --pos:#3aa877; --pos-soft:#12271d; --neg:#d16f68; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2a2415; --pill:#e8ebf1;
  }}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .anim-in .card,.anim-in .stat,.anim-in .hero,.anim-in .net{animation:rise .5s var(--ease) both}
  .anim-in .stat:nth-child(2){animation-delay:.05s}.anim-in .stat:nth-child(3){animation-delay:.1s}
  .anim-in .dleft>*:nth-child(2){animation-delay:.08s}.anim-in .net{animation-delay:.12s}
  .anim-in .grid3>*:nth-child(1){animation-delay:.14s}.anim-in .grid3>*:nth-child(2){animation-delay:.19s}.anim-in .grid3>*:nth-child(3){animation-delay:.24s}
  .anim-in .chart .aline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .1s forwards}
  .anim-in .chart .afill{animation:fadein .9s ease .3s both}

  /* layout */
  .app{display:grid;grid-template-columns:78px 1fr;min-height:100%}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0}
  .rail-logo{width:42px;height:42px;border-radius:8px;background:linear-gradient(150deg,var(--accent),var(--accent-4));
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(59,83,214,.4);margin-bottom:12px}
  .rail-logo svg{width:22px;height:22px}
  .rail-nav{display:flex;flex-direction:column;gap:6px;flex:1}
  .rbtn{width:44px;height:44px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);
    display:grid;place-items:center;transition:background .18s,color .18s,transform .18s;position:relative}
  .rbtn svg{width:21px;height:21px;transition:transform .18s var(--ease)}
  .rbtn:hover{background:var(--surface);color:var(--ink)} .rbtn:hover svg{transform:scale(1.12)}
  .rbtn.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .rbtn.on{background:var(--accent);color:#fff}
  .rbtn .tip{position:absolute;inset-inline-start:54px;top:50%;transform:translateY(-50%) translateX(-4px);background:var(--ink);
    color:var(--canvas);padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;
    pointer-events:none;transition:.15s;z-index:30}
  [dir=rtl] .rbtn .tip{inset-inline-start:auto;inset-inline-end:54px;transform:translateY(-50%) translateX(4px)}
  .rbtn:hover .tip{opacity:1;transform:translateY(-50%)}
  .rail-foot{display:flex;flex-direction:column;gap:6px;align-items:center}

  .main{min-width:0;padding:22px 26px 44px;max-width:1520px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .topbar h1{font-size:22px} .topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;font-weight:400}
  .topcluster{display:flex;align-items:center;gap:9px}

  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:7px;
    font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--disp);
    transition:transform .12s var(--ease),box-shadow .18s,border-color .18s,background .18s,color .18s}
  .btn svg{width:16px;height:16px}
  .btn:hover{border-color:var(--ink)} .btn:active{transform:translateY(1px) scale(.99)}
  .btn.primary{background:var(--pill);border-color:var(--pill);color:var(--canvas)}
  :root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{box-shadow:0 6px 16px rgba(23,26,33,.2)}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent:hover{box-shadow:0 6px 16px rgba(59,83,214,.32)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface);color:var(--ink)}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.danger:hover{border-color:var(--neg);color:var(--neg)}

  .lang-toggle{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:3px;gap:2px}
  .lang-toggle button{border:none;background:transparent;padding:7px 11px;border-radius:5px;font-weight:600;font-size:12.5px;color:var(--ink-soft);font-family:var(--disp);transition:.15s}
  .lang-toggle button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .lang-toggle button.on{background:var(--accent);color:#fff}
  .iconbtn{width:40px;height:40px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);
    display:grid;place-items:center;transition:.15s} .iconbtn:hover{color:var(--ink);border-color:var(--ink)} .iconbtn svg{width:18px;height:18px}

  .card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-sm);border:1px solid var(--line);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .card.hov:hover,.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
  .card-h h2{font-size:15px} .card-h .hint,.card-h .link{font-size:12px;color:var(--ink-faint);font-weight:500}
  .card-h .link{cursor:pointer;font-weight:600} .card-h .link:hover{color:var(--accent)}

  .dgrid{display:grid;grid-template-columns:1.85fr 1fr;gap:15px;align-items:start}
  .dleft,.dcol{display:flex;flex-direction:column;gap:15px;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:17px 18px 19px;box-shadow:var(--shadow-sm);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .stat .top{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12.5px;font-weight:500}
  .stat .ic{width:31px;height:31px;border-radius:6px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-soft);background:var(--surface-2)}
  .stat .ic svg{width:16px;height:16px}
  .stat.pos .ic{color:var(--pos)} .stat.neg .ic{color:var(--neg)} .stat.acc .ic{color:var(--accent)} .stat.warn .ic{color:var(--warn)}
  .stat .big{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-top:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .cur{font-size:12px;color:var(--ink-faint);font-weight:600;font-family:var(--disp)}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);font-family:var(--disp);border:1px solid var(--line-2)}
  .badge.pos{background:var(--pos-soft);color:var(--pos);border-color:transparent} .badge.neg{background:var(--neg-soft);color:var(--neg);border-color:transparent}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

  .hero{background:var(--dark);border-radius:var(--r-card);padding:19px 22px 13px;color:var(--on-dark);border:1px solid var(--dark-line);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 0%,rgba(142,162,255,.12),transparent 60%);pointer-events:none}
  .hero-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;position:relative}
  .hero-h h2{font-size:15px;color:#fff}
  .tf{display:flex;background:rgba(255,255,255,.07);border-radius:6px;padding:3px}
  .tf button{border:none;background:transparent;color:var(--on-dark-soft);padding:6px 12px;border-radius:5px;font-weight:600;font-size:12px;font-family:var(--disp);transition:.15s}
  .tf button.on{background:#fff;color:var(--dark)}
  .hero svg.chart{width:100%;height:206px;display:block;overflow:visible;position:relative}
  .hero-legend{display:flex;gap:16px;padding:8px 2px 4px;font-size:12px;color:var(--on-dark-soft);font-weight:500;position:relative}
  .hero-legend span{display:inline-flex;align-items:center;gap:7px} .hero-legend i{width:9px;height:9px;border-radius:3px}

  .net{padding:19px 20px 21px;display:flex;flex-direction:column;height:100%}
  .net .lbl{display:flex;align-items:center;justify-content:space-between}
  .net .lbl span{color:var(--ink-soft);font-weight:500;font-size:13px}
  .net .big{font-family:var(--mono);font-weight:700;font-size:29px;letter-spacing:-.02em;margin:12px 0 5px;line-height:1;font-variant-numeric:tabular-nums}
  .net .allsub{color:var(--ink-faint);font-size:12px;font-weight:500;margin-bottom:15px}
  .segbar{height:11px;border-radius:20px;overflow:hidden;display:flex;background:var(--surface-3);margin-bottom:15px}
  .segbar i{height:100%;transition:width .7s var(--ease)}
  .brk{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
  .brk .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
  .brk .row:first-child{border-top:none}
  .brk .k{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--ink-soft);font-size:13px}
  .brk .k i{width:9px;height:9px;border-radius:50%}
  .brk .v{font-family:var(--mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
  .net .btn{justify-content:center;margin-top:auto}

  .list{padding:6px 8px 10px}
  .lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;transition:background .14s}
  .lrow:hover{background:var(--surface-2)}
  .lrow .av{width:36px;height:36px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--disp);border:1px solid var(--line-2)}
  .lrow .mid{flex:1;min-width:0} .lrow .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lrow .s{font-size:11.5px;color:var(--ink-faint)}
  .amt{font-family:var(--mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}

  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:600;padding:12px 16px;white-space:nowrap}
  td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .14s} tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:end}
  .money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .money.pos{color:var(--pos)} .money.neg{color:var(--neg)}
  .muted{color:var(--ink-faint)} .strong{font-weight:600} .rowsub{font-size:11.5px;color:var(--ink-faint)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.active,.pill.received,.pill.paid{background:var(--pos-soft);color:var(--pos)}
  .pill.completed{background:var(--accent-soft);color:var(--accent-4)}
  .pill.on_hold,.pill.pending{background:var(--warn-soft);color:var(--warn)}
  .pill.overdue{background:var(--neg-soft);color:var(--neg)}
  .tag{display:inline-flex;padding:3px 10px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-soft)}
  .avatar{width:34px;height:34px;border-radius:6px;background:var(--accent-soft);color:var(--accent-4);display:inline-grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto;font-family:var(--disp)}
  .cellflex{display:flex;align-items:center;gap:11px}

  .empty{padding:44px 20px;text-align:center;color:var(--ink-faint)}
  .empty .eic{width:50px;height:50px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;animation:pop .4s var(--ease) both}
  .empty .eic svg{width:23px;height:23px;opacity:.6}
  .empty h3{font-size:15px;color:var(--ink-soft);margin-bottom:5px} .empty p{margin:0 0 16px;font-size:13px}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);transition:.15s}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-faint)}
  [dir=rtl] .search input{padding:11px 40px 11px 14px}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:3px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;padding:8px 13px;font-weight:600;font-size:12.5px;color:var(--ink-soft);border-radius:5px;font-family:var(--disp);transition:.15s}
  .seg button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .seg button.on{background:var(--accent);color:#fff}
  .totaltag{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:9px 14px;font-weight:500;font-size:13px;color:var(--ink-soft)}

  /* reports */
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .pnl{padding:18px 20px 20px} .pnl h2{font-size:15px;margin-bottom:14px}
  .pnl .line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .pnl .line:first-of-type{border-top:none}
  .pnl .line .k{color:var(--ink-soft);font-weight:500;font-size:13.5px} .pnl .line.total{border-top:2px solid var(--line-2);margin-top:4px}
  .pnl .line.total .k{color:var(--ink);font-weight:700;font-family:var(--disp)}
  .catbar{padding:14px 20px 20px} .catrow{margin-bottom:13px} .catrow:last-child{margin-bottom:0}
  .catrow .ct{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .catrow .ct .k{color:var(--ink-soft);font-weight:500} .catbar .bar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden}
  .catbar .bar i{display:block;height:100%;border-radius:20px;transition:width .7s var(--ease)}

  /* task board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 12px 14px;min-height:120px}
  .col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;font-family:var(--disp);font-weight:600;font-size:13.5px}
  .col-h .cnt{font-size:11px;color:var(--ink-faint);background:var(--surface-2);border-radius:20px;padding:2px 8px;font-weight:600}
  .col-h .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:7px}
  .tcard{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-mid);padding:11px 12px;margin-bottom:9px;transition:transform .15s var(--ease),box-shadow .15s;cursor:pointer}
  .tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--accent-3)}
  .tcard:last-child{margin-bottom:0}
  .tcard .tt{font-weight:600;font-size:13px;line-height:1.35;margin-bottom:8px}
  .tcard .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tcard .pr{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .tcard .chip{font-size:10.5px;color:var(--ink-faint);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-weight:500;white-space:nowrap}
  .tcard .chip.due{color:var(--ink-soft)} .tcard .chip.od{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
  .mav{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;font-family:var(--disp);flex:0 0 auto;margin-inline-start:auto}
  .col-add{width:100%;border:1px dashed var(--line-2);background:transparent;color:var(--ink-faint);border-radius:var(--r-mid);padding:9px;font-weight:600;font-size:12.5px;font-family:var(--disp);transition:.15s}
  .col-add:hover{border-color:var(--accent);color:var(--accent)}

const state={clients:[],projects:[],transactions:[],members:[],tasks:[],invoices:[],recurring:[],activity:[],settings:{company:"",vatRate:16,tin:"",address:""}};
let view="dashboard",readOnly=false,backend="loading",dbCap=null,userCap=null,chartMonths=6,reportPeriod="month",dashPeriod="all",invoiceId=null,detailId=null,taskFilter="all",invTab="invoice";
let justNavigated=true,paletteOpen=false,timerTick=null,ranRecurring=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

async function initStore(){
  try{dbCap=await claude.use("db");}catch(e){dbCap=null;}
  try{userCap=await claude.use("user"); if(userCap){const cw=userCap.can?userCap.can("data.write"):true; if(cw===false)readOnly=true;}}catch(e){userCap=null;}
  try{state.activity=JSON.parse(localStorage.getItem("mizan_activity")||"[]");}catch(e){state.activity=[];}
  if(dbCap){ backend="db"; ["clients","projects","transactions","members","tasks","invoices","recurring"].forEach(subscribe);
    try{dbCap.doc("settings/app").onSnapshot(s=>{if(s.exists)state.settings={...state.settings,...s.data()};render();});}catch(e){}
    render();
    setTimeout(()=>generateRecurring(),2200);
  } else { backend="local"; loadLocal(); render(); generateRecurring(); }
}
function logAct(action,kind,label){try{state.activity.unshift({ts:Date.now(),action,kind,label:label||""});if(state.activity.length>200)state.activity.length=200;localStorage.setItem("mizan_activity",JSON.stringify(state.activity));}catch(e){}}
function ymNow(){return new Date().toISOString().slice(0,7);}
function nextYM(ym){let[y,m]=ym.split("-").map(Number);m++;if(m>12){m=1;y++;}return y+"-"+String(m).padStart(2,"0");}
async function generateRecurring(){
  if(ranRecurring||readOnly)return;ranRecurring=true;const cur=ymNow();let added=0;
  for(const r of state.recurring){ if(r.active===false)continue;
    let m=r.lastMonth?nextYM(r.lastMonth):(r.startMonth||cur);
    let guard=0,lastGen=r.lastMonth;
    while(m<=cur&&guard++<60){
      const day=String(Math.min(28,Math.max(1,Number(r.dayOfMonth)||1))).padStart(2,"0");
      const tx={type:r.kind||"expense",amount:Number(r.amount)||0,date:m+"-"+day,category:r.category||"other",taxRate:Number(r.taxRate)||0,projectId:r.projectId||null,clientId:r.clientId||null,description:r.label||"",recurringId:r.id};
      if((tx.type)==="income")tx.status="received";tx.createdAt=new Date().toISOString();
      try{ if(backend==="db")await dbCap.collection("transactions").add(tx); else {state.transactions.push({id:uid(),...tx});} added++; }catch(e){}
      lastGen=m; m=nextYM(m);
    }
    if(lastGen&&lastGen!==r.lastMonth){ const rd={...r,lastMonth:lastGen,updatedAt:new Date().toISOString()};delete rd.id; try{await setRec("recurring",r.id,rd,true);}catch(e){} }
  }
  if(added){ if(backend==="local")saveLocal(); render(); toast(added+" "+L("generated_n")); }
}
function subscribe(coll){ try{dbCap.collection(coll).onSnapshot(s=>{state[coll]=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>{if(e&&e.code==="revoked"){readOnly=true;render();}});}catch(e){} }
function loadLocal(){ try{const r=localStorage.getItem("mizan_data"); if(r){const d=JSON.parse(r);state.clients=d.clients||[];state.projects=d.projects||[];state.transactions=d.transactions||[];state.members=d.members||[];state.tasks=d.tasks||[];state.invoices=d.invoices||[];state.recurring=d.recurring||[];}
  const s=localStorage.getItem("mizan_settings"); if(s)state.settings={...state.settings,...JSON.parse(s)};}catch(e){} }
function saveLocal(){ try{localStorage.setItem("mizan_data",JSON.stringify({clients:state.clients,projects:state.projects,transactions:state.transactions,members:state.members,tasks:state.tasks,invoices:state.invoices,recurring:state.recurring}));}catch(e){} }
function actLabel(c,d){if(!d)return"";if(c==="invoices")return (d.kind==="quote"?"QUO":"INV")+"-"+String(d.seq||0).padStart(4,"0");return d.name||d.title||d.label||d.description||(d.amount!=null?fmtNum(d.amount)+" "+L("curr"):"");}
async function addRec(c,d,silent){ if(backend==="db")await dbCap.collection(c).add(d); else{state[c].push({id:uid(),...d});saveLocal();render();} if(!silent)logAct("act_created",c,actLabel(c,d)); }
async function setRec(c,id,d,silent){ if(backend==="db")await dbCap.collection(c).doc(id).set(d); else{const i=state[c].findIndex(x=>x.id===id);if(i>-1)state[c][i]={id,...d};saveLocal();render();} if(!silent)logAct("act_updated",c,actLabel(c,d)); }
async function delRec(c,id,silent){ const before=state[c].find(x=>x.id===id); if(backend==="db")await dbCap.collection(c).doc(id).delete(); else{state[c]=state[c].filter(x=>x.id!==id);saveLocal();render();} if(!silent)logAct("act_deleted",c,actLabel(c,before)); }
async function saveSettings(obj){ state.settings={...state.settings,...obj};
  if(backend==="db"){try{await dbCap.doc("settings/app").set(state.settings);}catch(e){}} else {try{localStorage.setItem("mizan_settings",JSON.stringify(state.settings));}catch(e){}}
  render(); }

/* ===================== helpers ===================== */
function fmtNum(n,dec){dec=dec==null?3:dec; return Math.abs(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function money(n,sign){n=Number(n)||0; const p=sign&&n>0?"+":((sign&&n<0)||n<0?"−":""); return `${p}${fmtNum(n)} ${L("curr")}`;}
function bigMoney(n,sign){n=Number(n)||0; const p=sign&&n>0?"+":((sign&&n<0)||n<0?"−":""); return `<span class="count" data-to="${Math.abs(n)}" data-dec="3" data-prefix="${p}">${p}${fmtNum(n)}</span> <span class="cur">${L("curr")}</span>`;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){const p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase();}
function fmtDate(d){if(!d)return"—";try{return new Date(d+"T00:00:00").toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return d;}}
function todayISO(){return new Date().toISOString().slice(0,10);}
function clientName(id){const c=state.clients.find(x=>x.id===id);return c?c.name:null;}
function projName(id){const p=state.projects.find(x=>x.id===id);return p?p.name:null;}
function isReceived(t){return t.type==="income" && t.status!=="pending";}
function isOverdue(t){return t.type==="income" && t.status==="pending" && t.dueDate && t.dueDate<todayISO();}
function txStatus(t){ if(t.type!=="income")return null; if(t.status!=="pending")return"received"; return isOverdue(t)?"overdue":"pending"; }
function taxOf(t){const r=Number(t.taxRate)||0; if(!r)return 0; const amt=Number(t.amount)||0; return amt-amt/(1+r/100);}
function memberCostRate(id){const m=memberById(id);return m?(Number(m.costRate)||0):0;}
function memberBillRate(id){const m=memberById(id);return m?(Number(m.billableRate)||0):0;}
function projLabor(pid){let lab=0;for(const t of state.tasks){if(t.projectId!==pid)continue;lab+=(Number(t.loggedHours)||0)*memberCostRate(t.assigneeId);}return lab;}
function projStats(pid){let inc=0,exp=0;for(const t of state.transactions){if(t.projectId!==pid)continue;if(t.type==="income"){if(isReceived(t))inc+=+t.amount||0;}else exp+=+t.amount||0;}const labor=projLabor(pid);return{inc,exp,profit:inc-exp,labor,afterLabor:inc-exp-labor};}
function unbilledTasksForClient(clientId){return state.tasks.filter(t=>t.billable&&!t.billed&&(Number(t.loggedHours)||0)>0&&(t.clientId===clientId||(t.projectId&&(state.projects.find(p=>p.id===t.projectId)||{}).clientId===clientId)));}
function totals(list){list=list||state.transactions;let inc=0,exp=0,out=0;for(const t of list){if(t.type==="income"){if(isReceived(t))inc+=+t.amount||0;else out+=+t.amount||0;}else exp+=+t.amount||0;}return{inc,exp,net:inc-exp,out};}
function periodStart(key){const n=new Date();if(key==="month")return new Date(n.getFullYear(),n.getMonth(),1);if(key==="quarter")return new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1);if(key==="year")return new Date(n.getFullYear(),0,1);return null;}
function inPeriod(t,key){const s=periodStart(key);if(!s)return true;return new Date(t.date+"T00:00:00")>=s;}
function memberById(id){return state.members.find(m=>m.id===id);}
function memberName(id){const m=memberById(id);return m?m.name:null;}
function memberColor(id){const m=memberById(id);return m?(m.color||"#5a6270"):"#9aa0ac";}
function taskOverdue(t){return t.status!=="done"&&t.dueDate&&t.dueDate<todayISO();}
function openTaskCount(mid){return state.tasks.filter(t=>t.assigneeId===mid&&t.status!=="done").length;}
function overdueTaskCount(mid){return state.tasks.filter(t=>t.assigneeId===mid&&taskOverdue(t)).length;}
function invSubtotal(inv){return (inv.items||[]).reduce((a,it)=>a+(Number(it.qty)||0)*(Number(it.rate)||0),0);}
function invVat(inv){return invSubtotal(inv)*(Number(inv.vatRate)||0)/100;}
function invTotal(inv){return invSubtotal(inv)+invVat(inv);}
function invStatus(inv){if((inv.kind||"invoice")==="quote")return inv.status||"draft";if(inv.status==="paid")return"paid";if(inv.status!=="draft"&&inv.dueDate&&inv.dueDate<todayISO())return"overdue";return inv.status||"draft";}
function nextInvoiceSeq(kind){kind=kind||"invoice";return state.invoices.filter(i=>(i.kind||"invoice")===kind).reduce((m,i)=>Math.max(m,Number(i.seq)||0),0)+1;}
function invNumber(inv){return ((inv.kind==="quote")?"QUO-":"INV-")+String(inv.seq||0).padStart(4,"0");}
function invStPill(st){return {paid:"paid",overdue:"overdue",sent:"completed",draft:"on_hold",accepted:"received",declined:"overdue"}[st]||"on_hold";}
function invStLabel(inv,st){return (inv.kind==="quote"&&(st==="accepted"||st==="declined"))?L("q_"+st):L("iv_"+st);}
function dashTotals(){return totals(state.transactions.filter(t=>inPeriod(t,dashPeriod)));}
function budgetState(p){const s=projStats(p.id),b=Number(p.budget)||0;if(!b)return null;if(s.exp>b)return"over";if(s.inc>=b)return"full";return"ok";}

function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.documentElement.dataset.theme=theme;
  document.getElementById("root").innerHTML=`
    ${rail()}
    <div class="main ${justNavigated?'anim-in':''}">
      ${mobileTop()}
      ${topbar()}
      ${backend==="local"?`<div class="banner">${I.warn}${esc(L("local_note"))}</div>`:""}
      ${readOnly?`<div class="banner">${I.warn}${esc(L("readonly_note"))}</div>`:""}
      ${renderView()}
    </div>
    ${botnav()}
    ${paletteOpen?palette():""}`;
  bindInputs();
  if(paletteOpen){const pi=document.getElementById("palInput");if(pi)pi.focus();}
  if(justNavigated){ countUp(); justNavigated=false; }
  manageTimerTick();
}
function taskRunning(t){return !!t.timerStart;}
function elapsedHours(t){return t.timerStart?(Date.now()-new Date(t.timerStart).getTime())/3600000:0;}
async function startTimer(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const d={...t,timerStart:new Date().toISOString(),status:t.status==="todo"?"doing":(t.status||"doing"),updatedAt:new Date().toISOString()};delete d.id;await setRec("tasks",id,d,true);}
async function stopTimer(id){const t=state.tasks.find(x=>x.id===id);if(!t||!t.timerStart)return;const d={...t,loggedHours:Math.round(((Number(t.loggedHours)||0)+elapsedHours(t))*100)/100,timerStart:null,updatedAt:new Date().toISOString()};delete d.id;await setRec("tasks",id,d,true);}
function updateTimers(){document.querySelectorAll("[data-tstart]").forEach(el=>{const s=el.getAttribute("data-tstart"),base=Number(el.getAttribute("data-base"))||0;el.textContent=(base+(Date.now()-new Date(s).getTime())/3600000).toFixed(2)+"h";});}
function manageTimerTick(){const any=state.tasks.some(t=>t.timerStart);if(any&&!timerTick){timerTick=setInterval(updateTimers,1000);updateTimers();}else if(!any&&timerTick){clearInterval(timerTick);timerTick=null;}}

  return `<div class="topbar"><div><h1>${esc(L(t))}</h1><div class="sub">${esc(L(s))}</div></div>

    <div class="big" style="color:${t.net>=0?'var(--ink)':'var(--neg)'}">${bigMoney(t.net,true)}</div>
    <div class="allsub"><span class="badge ${t.net>=0?'pos':'neg'}">${esc(t.net>=0?L("profit"):L("loss"))}</span> · ${esc(L("all_time"))}</div>
    <div class="segbar">${gross>0?`<i style="width:${incPct}%;background:var(--pos)"></i><i style="width:${expPct}%;background:var(--neg)"></i>`:`<i style="width:100%;background:var(--surface-3)"></i>`}</div>
    <div class="brk">
      <div class="row"><span class="k"><i style="background:var(--pos)"></i>${esc(L("total_income"))}</span><span class="v" style="color:var(--pos)">${money(t.inc)}</span></div>
      <div class="row"><span class="k"><i style="background:var(--neg)"></i>${esc(L("expenses"))}</span><span class="v" style="color:var(--neg)">${money(t.exp)}</span></div>
      ${t.out>0?`<div class="row"><span class="k"><i style="background:var(--warn)"></i>${esc(L("outstanding"))}</span><span class="v" style="color:var(--warn)">${money(t.out)}</span></div>`:""}
    </div>
    ${!readOnly?`<button class="btn primary" onclick="openTx('expense')">${I.plus}${esc(L("add_expense"))}</button>`:""}</div>`;
  const recent=[...state.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);
  const recentCard=`<div class="card hov"><div class="card-h"><h2>${esc(L("recent"))}</h2>${state.transactions.length>5?`<span class="link" onclick="go('income')">${esc(L("view_all"))}</span>`:""}</div>
    <div class="list">${recent.length?recent.map(tx=>{const pn=projName(tx.projectId)||clientName(tx.clientId);const st=txStatus(tx);return `<div class="lrow"><span class="av">${esc(catLabel(tx.category).slice(0,2))}</span><div class="mid"><div class="t">${esc(catLabel(tx.category))} ${st&&st!=='received'?`<span class="pill ${st}" style="font-size:9.5px;padding:2px 7px">${esc(L("st_"+st))}</span>`:""}</div><div class="s">${pn?esc(pn):esc(L("no_project"))} · ${fmtDate(tx.date)}</div></div><span class="amt ${tx.type==='income'?'pos':'neg'}">${tx.type==='income'?'+':'−'}${money(tx.amount).replace('−','')}</span></div>`;}).join(""):emptyMini()}</div></div>`;
  const rows=state.projects.map(p=>({p,...projStats(p.id)})).filter(r=>r.inc||r.exp).sort((a,b)=>b.profit-a.profit).slice(0,5);

  const mk=new Date().toISOString().slice(0,7);let mInc=0,mExp=0;for(const t2 of state.transactions){if(String(t2.date).slice(0,7)!==mk)continue;if(t2.type==="income"){if(isReceived(t2))mInc+=+t2.amount||0;}else mExp+=+t2.amount||0;}

function emptyMini(){return `<div class="empty" style="padding:26px 12px"><div class="eic">${I.folder}</div><p style="margin:0">${esc(L("no_activity"))}</p></div>`;}

function areaChart(){
  const months=[];const now=new Date();
  for(let i=chartMonths-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.toISOString().slice(0,7),label:d.toLocaleDateString(lang==="ar"?"ar-EG":"en-US",{month:"short"})});}
  const data=months.map(m=>{let inc=0,exp=0;for(const t of state.transactions){if(String(t.date).slice(0,7)!==m.key)continue;if(t.type==="income"){if(isReceived(t))inc+=+t.amount||0;}else exp+=+t.amount||0;}return{...m,inc,exp};});
  const W=640,H=206,padX=26,padT=18,padB=30,max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const n=data.length,plotW=W-padX*2,plotH=H-padT-padB;
  const X=i=>padX+(n<=1?plotW/2:plotW*i/(n-1)),Y=v=>padT+plotH-(v/max)*plotH;
  const incPts=data.map((d,i)=>[X(i),Y(d.inc)]),expPts=data.map((d,i)=>[X(i),Y(d.exp)]);
  const smooth=pts=>{if(pts.length<2)return pts.length?`M${pts[0][0]},${pts[0][1]}`:"";let dd=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;dd+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return dd;};
  const incLine=smooth(incPts),expLine=smooth(expPts),baseY=padT+plotH;
  const area=incLine?`${incLine} L${X(n-1)},${baseY} L${X(0)},${baseY} Z`:"";
  const grid=[0,.5,1].map(f=>`<line x1="${padX}" x2="${W-padX}" y1="${padT+plotH*f}" y2="${padT+plotH*f}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`).join("");
  const labels=data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--on-dark-soft)" font-family="var(--font)">${esc(d.label)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="incg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart-inc)" stop-opacity=".32"/><stop offset="1" stop-color="var(--chart-inc)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path class="afill" d="${area}" fill="url(#incg)"/>`:""}
    ${expLine?`<path class="aline" pathLength="1" d="${expLine}" fill="none" stroke="var(--chart-exp)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}

    ${incPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--dark)" stroke="var(--chart-inc)" stroke-width="2"/>`).join("")}
    ${labels}</svg>`;
}

/* ---------- transactions ---------- */
function txView(type){
  const isInc=type==="income",key=isInc?"incSearch":"expSearch",q=filters[key].toLowerCase();
  let list=state.transactions.filter(t=>t.type===type).filter(t=>!q||[catLabel(t.category),t.description,projName(t.projectId),clientName(t.clientId)].some(v=>String(v||"").toLowerCase().includes(q))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const body=list.map(t=>{const pn=projName(t.projectId),cn=clientName(t.clientId),st=txStatus(t);

      <td><div class="strong">${esc(catLabel(t.category))}</div>${t.description?`<div class="rowsub">${esc(t.description)}</div>`:(t.taxRate?`<div class="rowsub">${esc(L("vat"))} ${t.taxRate}%</div>`:"")}</td>
      <td>${pn?esc(pn):`<span class="muted">${esc(L("no_project"))}</span>`}${cn&&cn!==pn?`<div class="rowsub">${esc(cn)}</div>`:""}</td>
      ${isInc?`<td>${st?`<span class="pill ${st}">${esc(L("st_"+st))}</span>`:""}${st==='overdue'||st==='pending'?(readOnly?"":`<button class="btn sm" style="margin-inline-start:6px;padding:4px 8px" onclick="markReceived('${t.id}')">${esc(L("mark_received"))}</button>`):""}</td>`:""}

function reportsView(){
  const list=state.transactions.filter(t=>inPeriod(t,reportPeriod));

  const pnl=`<div class="card pnl"><h2>${esc(L("pnl"))}</h2>

    <div class="line"><span class="k">${esc(L("total_expenses"))}</span><span class="money neg">${money(t.exp)}</span></div>

    <div class="line"><span class="k">${esc(L("margin"))}</span><span class="money">${margin}%</span></div>
    ${t.out>0?`<div class="line"><span class="k">${esc(L("outstanding"))} (${esc(L("to_collect"))})</span><span class="money warn" style="color:var(--warn)">${money(t.out)}</span></div>`:""}</div>`;
  const vat=`<div class="card pnl"><h2>${esc(L("vat_summary"))}</h2>
    <div class="line"><span class="k">${esc(L("vat_collected"))}</span><span class="money pos">${money(vatCol)}</span></div>
    <div class="line"><span class="k">${esc(L("vat_paid"))}</span><span class="money neg">${money(vatPaid)}</span></div>
    <div class="line total"><span class="k">${esc(L("vat_net"))}</span><span class="money ${vatCol-vatPaid>=0?'':'neg'}">${money(vatCol-vatPaid,true)}</span></div>
    <div class="line"><span class="k muted" style="font-size:12px">${esc(L("vat_rate"))}</span><span class="muted" style="font-size:12px">${esc(state.settings.vatRate)}% ${esc(L("vat"))}</span></div></div>`;
  const catAgg=(type)=>{const m={};for(const x of list){if(x.type!==type)continue;if(type==="income"&&!isReceived(x))continue;m[x.category]=(m[x.category]||0)+(+x.amount||0);}return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const incCats=catAgg("income"),expCats=catAgg("expense");
  const catCard=(title,cats,color)=>{const max=Math.max(1,...cats.map(c=>c[1]));return `<div class="card catbar"><div class="card-h" style="padding:2px 0 12px"><h2>${esc(title)}</h2></div>${cats.length?cats.map(([k,v])=>`<div class="catrow"><div class="ct"><span class="k">${esc(catLabel(k))}</span><span class="money">${money(v)}</span></div><div class="bar"><i style="width:${v/max*100}%;background:${color}"></i></div></div>`).join(""):`<div class="muted" style="padding:8px 0">${esc(L("no_data"))}</div>`}</div>`;};
  const clientAgg={};for(const x of list){if(x.type==="income"&&isReceived(x)&&x.clientId)clientAgg[x.clientId]=(clientAgg[x.clientId]||0)+(+x.amount||0);}
  const topCl=Object.entries(clientAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const clientsCard=`<div class="card catbar"><div class="card-h" style="padding:2px 0 12px"><h2>${esc(L("top_clients"))}</h2></div>${topCl.length?topCl.map(([id,v])=>`<div class="catrow"><div class="ct"><span class="k">${esc(clientName(id)||L("none"))}</span><span class="money">${money(v)}</span></div><div class="bar"><i style="width:${v/clMax*100}%;background:var(--accent)"></i></div></div>`).join(""):`<div class="muted" style="padding:8px 0">${esc(L("no_data"))}</div>`}</div>`;
  return seg+`<div class="rgrid" style="margin-bottom:15px">${pnl}${vat}</div><div class="rgrid" style="margin-bottom:15px">${catCard(L("income_by_cat"),incCats,'var(--pos)')}${catCard(L("expense_by_cat"),expCats,'var(--neg)')}</div>${clientsCard}`;
}

function timerControl(t){
  if(readOnly)return t.loggedHours?`<span class="chip">${t.loggedHours}h</span>`:"";

function taskCard(t){
  const prColor={none:"transparent",low:"var(--ink-faint)",medium:"var(--warn)",high:"var(--neg)"};
  const od=taskOverdue(t),pn=projName(t.projectId),m=memberById(t.assigneeId);

/* ---------- client / project detail ---------- */
function openClientDetail(id){detailId=id;go('client');}
function openProjectDetail(id){detailId=id;go('project');}
function dstat(lbl,val,color,sub){return `<div class="stat"><div class="top">${esc(lbl)}</div><div class="big"><span class="money" style="color:${color||'var(--ink)'}">${typeof val==='number'?money(val):val}</span></div>${sub?`<div class="rowsub" style="margin-top:5px">${sub}</div>`:""}</div>`;}
function clientDetail(){
  const c=state.clients.find(x=>x.id===detailId);if(!c)return emptyState("no_clients_h","no_clients_p","");
  const invs=state.invoices.filter(i=>i.clientId===c.id&&(i.kind||"invoice")==="invoice").sort((a,b)=>(b.seq||0)-(a.seq||0));
  const txs=state.transactions.filter(t=>t.clientId===c.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  let received=0,pending=0;txs.forEach(t=>{if(t.type==="income"){if(isReceived(t))received+=+t.amount||0;else pending+=+t.amount||0;}});
  const head=`<div class="card" style="padding:20px 22px;margin-bottom:15px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center">

  const invTable=invs.length?`<div class="card" style="margin-bottom:15px"><div class="card-h"><h2>${esc(L("invoices"))}</h2></div><div class="wrap"><table><thead><tr><th>${esc(L("invoice_no"))}</th><th>${esc(L("issue_date"))}</th><th>${esc(L("status"))}</th><th class="r">${esc(L("grand_total"))}</th></tr></thead><tbody>${invs.map(i=>{const st=invStatus(i);return `<tr onclick="viewInvoice('${i.id}')" style="cursor:pointer"><td class="mono strong">${esc(invNumber(i))}</td><td class="muted">${fmtDate(i.issueDate)}</td><td><span class="pill ${invStPill(st)}">${esc(invStLabel(i,st))}</span></td><td class="r money">${money(invTotal(i))}</td></tr>`;}).join("")}</tbody></table></div></div>`:"";
  const ledger=`<div class="card"><div class="card-h"><h2>${esc(L("ledger"))}</h2></div><div class="wrap"><table><thead><tr><th>${esc(L("date"))}</th><th>${esc(L("category"))}</th><th>${esc(L("project"))}</th><th class="r">${esc(L("amount"))}</th></tr></thead><tbody>${txs.length?txs.map(t=>`<tr><td class="muted">${fmtDate(t.date)}</td><td>${esc(catLabel(t.category))}${t.type==='income'&&t.status==='pending'?` <span class="pill pending" style="font-size:9.5px;padding:2px 6px">${esc(L("st_pending"))}</span>`:""}</td><td>${projName(t.projectId)?esc(projName(t.projectId)):'<span class="muted">—</span>'}</td><td class="r"><span class="money ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${money(t.amount).replace('−','')}</span></td></tr>`).join(""):`<tr><td colspan="4" class="empty">${esc(L("no_tx"))}</td></tr>`}</tbody></table></div></div>`;
  return head+kpis+invTable+ledger;

function projectDetail(){

function confirmDel(coll,id){
  modalHost().innerHTML=shell(L("delete"),`<div class="modal-b"><p style="margin:6px 0 4px;font-size:16px;font-weight:600">${esc(L("confirm_del"))}</p><p class="muted" style="margin:0">${esc(L("confirm_del_body"))}</p></div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">${esc(L("cancel"))}</button><button type="button" class="btn" id="mSubmit" style="background:var(--neg);border-color:var(--neg);color:#fff">${esc(L("delete"))}</button></div>`);
  document.getElementById("mSubmit").onclick=async()=>{await save(()=>delRec(coll,id),L("deleted"));};
}
async function save(fn,msg){
  const b=document.getElementById("mSubmit");if(b){b.disabled=true;b.style.opacity=".6";}
  try{await fn();closeModal();toast(msg||L("saved"));}
  catch(e){if(b){b.disabled=false;b.style.opacity="1";}if(e&&e.code==="invalid_argument"){readOnly=true;closeModal();render();toast(L("readonly_note"));}else toast((e&&e.message)||"Error");}
}
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function num(id){const el=document.getElementById(id);const n=el?parseFloat(el.value):NaN;return isNaN(n)?0:n;}
function shake(id){const el=document.getElementById(id);if(el){el.style.borderColor="var(--neg)";el.focus();}}

/* ===================== CSV export ===================== */
function exportCSV(){
  const list=state.transactions.filter(t=>inPeriod(t,reportPeriod)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const head=["Date","Type","Category","Project","Client","Amount (JOD)","VAT %","Status","Description"];
  const rows=list.map(t=>[t.date,t.type,catLabel(t.category),projName(t.projectId)||"",clientName(t.clientId)||"",(+t.amount||0).toFixed(3),t.taxRate||0,t.type==="income"?(t.status||"received"):"",(t.description||"").replace(/[\r\n]+/g," ")]);
  const csv=[head,...rows].map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\r\n");
  try{
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`mizan-${reportPeriod}-${todayISO()}.csv`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
    toast(L("export_csv"));
  }catch(e){toast("Export not available here");}
}

/* ===================== events / anim ===================== */
function go(k){view=k;justNavigated=true;render();window.scrollTo(0,0);}
function setLang(l){lang=l;try{localStorage.setItem("mizan_lang",l);}catch(e){}closeModal();justNavigated=true;render();}
function toggleTheme(){theme=theme==="dark"?"light":"dark";try{localStorage.setItem("mizan_theme",theme);}catch(e){}render();}
function setMonths(m){chartMonths=m;justNavigated=true;render();}
function setPeriod(p){reportPeriod=p;justNavigated=true;render();}
function setDashPeriod(p){dashPeriod=p;justNavigated=true;render();}
function setProjStatus(s){filters.projStatus=s;render();}
function bindInputs(){
  [["clientSearch","clientSearch"],["projSearch","projSearch"],["incSearch","incSearch"],["expSearch","expSearch"]].forEach(([id,key])=>{
    const el=document.getElementById(id);if(el)el.oninput=()=>{filters[key]=el.value;const p=el.selectionStart;render();const e2=document.getElementById(id);if(e2){e2.focus();try{e2.setSelectionRange(p,p);}catch(_){}}};
  });
  const pin=document.getElementById("palInput");if(pin){pin.oninput=()=>{palQuery=pin.value;palSel=0;updatePaletteList();};pin.onkeydown=palKey;}
}
/* command palette */
let palQuery="",palSel=0;
function openPalette(){paletteOpen=true;palQuery="";palSel=0;render();}
function closePalette(){paletteOpen=false;render();}
function palItems(){
  const q=palQuery.trim().toLowerCase();
  const qa=[];
  if(!readOnly){
    qa.push({icon:I.invoices,t:L("new_invoice"),s:L("quick_actions"),run:()=>{closePalette();openInvoice(null,'invoice');}});
    qa.push({icon:I.invoices,t:L("new_quote"),s:L("quick_actions"),run:()=>{closePalette();openInvoice(null,'quote');}});
    qa.push({icon:I.tasks,t:L("add_task"),s:L("quick_actions"),run:()=>{closePalette();openTask();}});
    qa.push({icon:I.income,t:L("add_income"),s:L("quick_actions"),run:()=>{closePalette();openTx('income');}});
    qa.push({icon:I.expenses,t:L("add_expense"),s:L("quick_actions"),run:()=>{closePalette();openTx('expense');}});
    qa.push({icon:I.clients,t:L("add_client"),s:L("quick_actions"),run:()=>{closePalette();openClient();}});
    qa.push({icon:I.projects,t:L("add_project"),s:L("quick_actions"),run:()=>{closePalette();openProject();}});
    qa.push({icon:I.clock,t:L("manage_recurring"),s:L("quick_actions"),run:()=>{closePalette();openRecurring();}});
  }
  qa.push({icon:I.reports,t:L("activity_log"),s:L("quick_actions"),run:()=>{closePalette();openActivity();}});
  const nav=NAV.map(([k,ic])=>({icon:ic,t:L("nav_"+k),s:L("go_to"),run:()=>{closePalette();go(k);}}));
  const data=[];
  state.clients.forEach(c=>data.push({icon:I.clients,t:c.name,s:L("client"),run:()=>{closePalette();go('clients');}}));
  state.projects.forEach(p=>data.push({icon:I.projects,t:p.name,s:L("project")+(clientName(p.clientId)?" · "+clientName(p.clientId):""),run:()=>{closePalette();go('projects');}}));
  state.tasks.forEach(t=>data.push({icon:I.tasks,t:t.title,s:L("nav_tasks"),run:()=>{closePalette();go('tasks');}}));
  state.invoices.forEach(inv=>data.push({icon:I.invoices,t:invNumber(inv)+" · "+(clientName(inv.clientId)||""),s:L("invoice"),run:()=>{closePalette();invoiceId=inv.id;go('invoice');}}));
  const match=it=>!q||(it.t+" "+it.s).toLowerCase().includes(q);
  return {quick:qa.filter(match),nav:nav.filter(match),data:data.filter(match)};
}
function palRow(it,idx){return `<div class="pal-it ${idx===palSel?'sel':''}" onclick="palRun(${idx})"><span class="pi">${it.icon}</span><div style="min-width:0"><div class="pt">${esc(it.t)}</div><div class="ps">${esc(it.s)}</div></div></div>`;}
function palListHTML(){
  const g=palItems();window._palFlat=[...g.quick,...g.nav,...g.data];
  if(palSel>=window._palFlat.length)palSel=Math.max(0,window._palFlat.length-1);
  if(!window._palFlat.length)return `<div class="pal-empty">${esc(L("no_results"))}</div>`;
  const sec=(title,arr,start)=>arr.length?`<div class="pal-sec">${esc(title)}</div>`+arr.map((it,i)=>palRow(it,start+i)).join(""):"";
  let idx=0,html="";
  html+=sec(L("quick_actions"),g.quick,idx);idx+=g.quick.length;
  html+=sec(L("go_to"),g.nav,idx);idx+=g.nav.length;
  html+=g.data.map((it,i)=>palRow(it,idx+i)).join("");
  return html;
}
function palette(){return `<div class="palscrim" onclick="if(event.target===this)closePalette()"><div class="pal"><div class="pal-in">${I.search}<input id="palInput" placeholder="${esc(L("search_all"))}" value="${esc(palQuery)}" autocomplete="off"></div><div class="pal-list" id="palList">${palListHTML()}</div></div></div>`;}
function updatePaletteList(){const el=document.getElementById("palList");if(el)el.innerHTML=palListHTML();}
function palRun(i){const it=window._palFlat&&window._palFlat[i];if(it)it.run();}
function palKey(e){if(!paletteOpen)return;if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min((window._palFlat.length||1)-1,palSel+1);updatePaletteList();}else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);updatePaletteList();}else if(e.key==="Enter"){e.preventDefault();palRun(palSel);}else if(e.key==="Escape"){e.preventDefault();closePalette();}}
let gPend=false;
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();paletteOpen?closePalette():openPalette();return;}
  const tag=(e.target&&e.target.tagName||"").toLowerCase();const typing=tag==="input"||tag==="textarea"||tag==="select";
  if(typing||paletteOpen||modalHost().innerHTML)return;
  if(e.key==="/"){e.preventDefault();openPalette();return;}
  if(e.key.toLowerCase()==="g"&&!e.metaKey&&!e.ctrlKey){gPend=true;setTimeout(()=>gPend=false,800);return;}
  if(gPend){const mp={d:"dashboard",c:"clients",p:"projects",t:"tasks",v:"invoices",i:"income",e:"expenses",r:"reports"};const k=mp[e.key.toLowerCase()];if(k)go(k);gPend=false;return;}
  if(e.key.toLowerCase()==="n"&&!readOnly){const m={clients:openClient,projects:openProject,tasks:openTask,invoices:openInvoice,income:()=>openTx('income'),expenses:()=>openTx('expense')};if(m[view])m[view]();}
});
function countUp(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const els=document.querySelectorAll(".count[data-to]");
  els.forEach(el=>{
    const to=Number(el.dataset.to)||0,dec=Number(el.dataset.dec)||0,prefix=el.dataset.prefix||"";
    if(to===0)return; const dur=650,t0=performance.now();
    function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),cur=to*e;
      el.textContent=prefix+cur.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}
let toastTimer;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2400);}

/* ===================== boot ===================== */
render();
initStore();
</script>
