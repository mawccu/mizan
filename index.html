<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light dark;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Mizan Accounts</title>
<meta name="description" content="Bilingual company accounting: clients, projects, invoices, income, expenses, VAT and reports, in JOD.">
<style>
  :root{
    --canvas:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eceef1;
    --ink:#171a21; --ink-soft:#5a616d; --ink-faint:#6b7280; --ink-ghost:#949ba7; --on-accent:#ffffff;
    --line:#e8eaee; --line-2:#dfe2e7;
    --accent:#3b53d6; --accent-2:#6274e0; --accent-3:#aeb6e8; --accent-4:#2739a3; --accent-soft:#eaecfb;
    --dark:#0f1218; --dark-2:#171b24; --on-dark:#eef0f5; --on-dark-soft:#828b9e; --dark-line:#242a36;
    --pos:#0f7449; --pos-soft:#e6f2ec; --neg:#a83b35; --neg-soft:#f7e9e8; --warn:#7d5a12; --warn-soft:#f6efdd;
    --pill:#171a21;
    --chart-inc:#8ea2ff; --chart-exp:#e0938a;
    --r-card:8px; --r-mid:6px; --r-sm:5px;
    --shadow:0 1px 2px rgba(20,24,34,.05), 0 8px 24px rgba(20,24,34,.05);
    --shadow-sm:0 1px 1px rgba(20,24,34,.04);
    --shadow-lift:0 2px 4px rgba(20,24,34,.06), 0 16px 40px rgba(20,24,34,.09);
    --disp:"Space Grotesk","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
    --font:"Hanken Grotesk","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,monospace;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  :root[data-theme="dark"]{
    --canvas:#0a0c10; --surface:#13161d; --surface-2:#181c24; --surface-3:#212632;
    --ink:#e8ebf1; --ink-soft:#98a0ae; --ink-faint:#8b93a3; --ink-ghost:#626a79; --on-accent:#0f1218;
    --line:#212632; --line-2:#2a303d;
    --accent:#7488e6; --accent-2:#8394e6; --accent-3:#37436a; --accent-4:#aab6ee; --accent-soft:#1b2338;
    --dark:#12151d; --dark-2:#191d27; --on-dark:#eef0f5; --on-dark-soft:#828b9e; --dark-line:#252b38;
    --pos:#3aa877; --pos-soft:#12271d; --neg:#d16f68; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2a2415;
    --pill:#e8ebf1; --chart-inc:#8ea2ff; --chart-exp:#e0938a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.4);
    --shadow-sm:0 1px 1px rgba(0,0,0,.4); --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){
    --canvas:#0a0c10; --surface:#13161d; --surface-2:#181c24; --surface-3:#212632;
    --ink:#e8ebf1; --ink-soft:#98a0ae; --ink-faint:#8b93a3; --ink-ghost:#626a79; --on-accent:#0f1218; --line:#212632; --line-2:#2a303d;
    --accent:#7488e6; --accent-4:#aab6ee; --accent-soft:#1b2338; --dark:#12151d;
    --pos:#3aa877; --pos-soft:#12271d; --neg:#d16f68; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2a2415; --pill:#e8ebf1;
  }}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .anim-in .card,.anim-in .stat,.anim-in .hero,.anim-in .net{animation:rise .5s var(--ease) both}
  .anim-in .stat:nth-child(2){animation-delay:.05s}.anim-in .stat:nth-child(3){animation-delay:.1s}
  .anim-in .dleft>*:nth-child(2){animation-delay:.08s}.anim-in .net{animation-delay:.12s}
  .anim-in .grid3>*:nth-child(1){animation-delay:.14s}.anim-in .grid3>*:nth-child(2){animation-delay:.19s}.anim-in .grid3>*:nth-child(3){animation-delay:.24s}
  .anim-in .chart .aline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .1s forwards}
  .anim-in .chart .afill{animation:fadein .9s ease .3s both}

  /* layout: labeled sidebar + main */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
  .side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:16px 12px 14px;background:var(--surface);border-inline-end:1px solid var(--line)}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px}
  .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(150deg,var(--accent),var(--accent-4));display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 6px 16px rgba(59,83,214,.32)}
  .logo svg{width:19px;height:19px}
  .side-brand .bn{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.1}
  .side-brand .bs{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;margin-top:2px}
  .side-new{justify-content:center;margin:0 0 10px}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sbtn{display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;color:var(--ink-soft);padding:10px 11px;border-radius:7px;font-weight:600;font-size:13.5px;font-family:var(--disp);text-align:start;transition:background .15s,color .15s}
  .sbtn svg{width:19px;height:19px;flex:0 0 auto}
  .sbtn:hover{background:var(--surface-2);color:var(--ink)}
  .sbtn.on{background:var(--accent-soft);color:var(--accent-4)}
  .sbtn kbd{margin-inline-start:auto;font-size:10.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-faint);font-family:var(--disp)}
  .side-foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
  .side-chip{display:flex;align-items:center;gap:8px;border:none;background:transparent;color:var(--ink-faint);font-size:11.5px;padding:7px 11px;border-radius:7px;text-align:start;font-family:var(--font);cursor:pointer;width:100%}
  .side-chip svg{width:14px;height:14px;flex:0 0 auto} .side-chip:hover{background:var(--surface-2)} .side-chip.warn{color:var(--warn)}
  .side-row{display:flex;gap:8px;align-items:center;padding:6px 2px 0}
  .side-row .lang-toggle{flex:1} .side-row .lang-toggle button{flex:1}
  .subtabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:3px;margin:-6px 0 18px;width:max-content;max-width:100%;overflow-x:auto}
  .subtabs button{border:none;background:transparent;padding:8px 14px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink-soft);font-family:var(--disp);white-space:nowrap;transition:.15s}
  .subtabs button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .subtabs button.on{background:var(--accent);color:var(--on-accent)}
  .fab{display:none}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:8px}
  .qbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:12px 13px;font-weight:600;font-size:13px;color:var(--ink);font-family:var(--disp);text-align:start;transition:.15s}
  .qbtn svg{width:18px;height:18px;color:var(--accent);flex:0 0 auto} .qbtn:hover,.qbtn:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
  .qa{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
  .qab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 13px;font-weight:600;font-size:13px;color:var(--ink);font-family:var(--disp);transition:.15s;white-space:nowrap}
  .qab svg{width:16px;height:16px;color:var(--accent)} .qab:hover{border-color:var(--accent);transform:translateY(-1px)}
  .att .ai,.sec .ai{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;background:var(--surface-2)} .att .ai svg,.sec .ai svg{width:16px;height:16px}
  .att.neg .ai{background:var(--neg-soft);color:var(--neg)} .att.warn .ai{background:var(--warn-soft);color:var(--warn)} .att.acc .ai{background:var(--accent-soft);color:var(--accent-4)}
  .lrow>svg:last-child{width:16px;height:16px;color:var(--ink-faint);flex:0 0 auto;margin-inline-start:auto} [dir=rtl] .lrow>svg:last-child{transform:scaleX(-1)}
  .allclear{display:flex;align-items:center;gap:10px;padding:16px 12px;color:var(--pos);font-weight:600;font-size:13.5px} .allclear svg{width:18px;height:18px;flex:0 0 auto}
  .gs .gsbar{height:6px;background:var(--surface-3);border-radius:20px;margin:8px 18px 4px;overflow:hidden} .gs .gsbar i{display:block;height:100%;background:var(--accent);transition:width .7s var(--ease)}
  .gsrow .gsc{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:0 0 auto;color:#fff} .gsrow .gsc svg{width:12px;height:12px}
  .gsrow.done .gsc{background:var(--pos);border-color:var(--pos)} .gsrow.done{cursor:default} .gsrow.done .t{color:var(--ink-faint);text-decoration:line-through}
  .gsrow .t{font-weight:600;font-size:13.5px}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
  .attgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .qa,.subtabs,.topcluster .seg{scrollbar-width:none} .qa::-webkit-scrollbar,.subtabs::-webkit-scrollbar,.topcluster .seg::-webkit-scrollbar{display:none}
  .sec .secb{padding:12px 18px 18px} .sec .secf{display:flex;gap:8px;padding:6px 12px 14px}
  .lbl2{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px} .kv:first-of-type{border-top:none}
  .kv .k{color:var(--ink-soft);font-weight:500} .kv .v{font-weight:600} .kv .v.warnc{color:var(--warn)}
  kbd{font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;font-family:var(--disp)}
  .dotc{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)} th.sortable svg{width:12px;height:12px;vertical-align:-2px;margin-inline-start:4px} th.sortable.on{color:var(--accent-4)}
  tr.rowlink{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  tr[role=button]:focus-visible{outline-offset:-2px}

  .main{min-width:0;padding:22px 26px 44px;max-width:1520px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .topbar h1{font-size:22px} .topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;font-weight:400}
  .topcluster{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
  .lt-desktop{display:inline-flex;align-items:center;gap:9px}

  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:7px;
    font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--disp);
    transition:transform .12s var(--ease),box-shadow .18s,border-color .18s,background .18s,color .18s}
  .btn svg{width:16px;height:16px}
  .btn:hover{border-color:var(--ink)} .btn:active{transform:translateY(1px) scale(.99)}
  .btn.primary,.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover,.btn.accent:hover{box-shadow:0 6px 16px rgba(59,83,214,.32);border-color:var(--accent)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface);color:var(--ink)}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.danger:hover{border-color:var(--neg);color:var(--neg)}

  .lang-toggle{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:3px;gap:2px}
  .lang-toggle button{border:none;background:transparent;padding:7px 11px;border-radius:5px;font-weight:600;font-size:12.5px;color:var(--ink-soft);font-family:var(--disp);transition:.15s}
  .lang-toggle button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .lang-toggle button.on{background:var(--accent);color:var(--on-accent)}
  .iconbtn{width:40px;height:40px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);
    display:grid;place-items:center;transition:.15s} .iconbtn:hover{color:var(--ink);border-color:var(--ink)} .iconbtn svg{width:18px;height:18px}

  .card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-sm);border:1px solid var(--line);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .card.hov:hover,.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
  .card-h h2{font-size:15px} .card-h .hint,.card-h .link{font-size:12px;color:var(--ink-faint);font-weight:500}
  .card-h .link{cursor:pointer;font-weight:600} .card-h .link:hover{color:var(--accent)}

  .dgrid{display:grid;grid-template-columns:1.85fr 1fr;gap:15px;align-items:start}
  .dleft,.dcol{display:flex;flex-direction:column;gap:15px;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:17px 18px 19px;box-shadow:var(--shadow-sm);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .stat .top{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12.5px;font-weight:500}
  .stat .ic{width:31px;height:31px;border-radius:6px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-soft);background:var(--surface-2)}
  .stat .ic svg{width:16px;height:16px}
  .stat.pos .ic{color:var(--pos)} .stat.neg .ic{color:var(--neg)} .stat.acc .ic{color:var(--accent)} .stat.warn .ic{color:var(--warn)}
  .stat .big{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-top:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .cur{font-size:12px;color:var(--ink-faint);font-weight:600;font-family:var(--disp)}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);font-family:var(--disp);border:1px solid var(--line-2)}
  .badge.pos{background:var(--pos-soft);color:var(--pos);border-color:transparent} .badge.neg{background:var(--neg-soft);color:var(--neg);border-color:transparent}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

  .hero{background:var(--dark);border-radius:var(--r-card);padding:19px 22px 13px;color:var(--on-dark);border:1px solid var(--dark-line);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 0%,rgba(142,162,255,.12),transparent 60%);pointer-events:none}
  .hero-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;position:relative}
  .hero-h h2{font-size:15px;color:#fff}
  .tf{display:flex;background:rgba(255,255,255,.07);border-radius:6px;padding:3px}
  .tf button{border:none;background:transparent;color:var(--on-dark-soft);padding:6px 12px;border-radius:5px;font-weight:600;font-size:12px;font-family:var(--disp);transition:.15s}
  .tf button.on{background:#fff;color:var(--dark)}
  .hero svg.chart{width:100%;height:206px;display:block;overflow:visible;position:relative}
  .hero-legend{display:flex;gap:16px;padding:8px 2px 4px;font-size:12px;color:var(--on-dark-soft);font-weight:500;position:relative}
  .hero-legend span{display:inline-flex;align-items:center;gap:7px} .hero-legend i{width:9px;height:9px;border-radius:3px}

  .net{padding:19px 20px 21px;display:flex;flex-direction:column;height:100%}
  .net .lbl{display:flex;align-items:center;justify-content:space-between}
  .net .lbl span{color:var(--ink-soft);font-weight:500;font-size:13px}
  .net .big{font-family:var(--mono);font-weight:700;font-size:29px;letter-spacing:-.02em;margin:12px 0 5px;line-height:1;font-variant-numeric:tabular-nums}
  .net .allsub{color:var(--ink-faint);font-size:12px;font-weight:500;margin-bottom:15px}
  .segbar{height:11px;border-radius:20px;overflow:hidden;display:flex;background:var(--surface-3);margin-bottom:15px}
  .segbar i{height:100%;transition:width .7s var(--ease)}
  .brk{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
  .brk .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
  .brk .row:first-child{border-top:none}
  .brk .k{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--ink-soft);font-size:13px}
  .brk .k i{width:9px;height:9px;border-radius:50%}
  .brk .v{font-family:var(--mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
  .net .btn{justify-content:center;margin-top:auto}

  .list{padding:6px 8px 10px}
  .lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;transition:background .14s}
  .lrow:hover{background:var(--surface-2)}
  .lrow .av{width:36px;height:36px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--disp);border:1px solid var(--line-2)}
  .lrow .mid{flex:1;min-width:0} .lrow .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lrow .s{font-size:11.5px;color:var(--ink-faint)}
  .amt{font-family:var(--mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}

  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:600;padding:12px 16px;white-space:nowrap}
  td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .14s} tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:end}
  .money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .money.pos{color:var(--pos)} .money.neg{color:var(--neg)}
  .muted{color:var(--ink-faint)} .strong{font-weight:600} .rowsub{font-size:11.5px;color:var(--ink-faint)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.active,.pill.received,.pill.paid{background:var(--pos-soft);color:var(--pos)}
  .pill.completed{background:var(--accent-soft);color:var(--accent-4)}
  .pill.on_hold,.pill.pending{background:var(--warn-soft);color:var(--warn)}
  .pill.overdue{background:var(--neg-soft);color:var(--neg)}

function ymNow(){return ym(new Date());}
function nextYM(ym){let[y,m]=ym.split("-").map(Number);m++;if(m>12){m=1;y++;}return y+"-"+String(m).padStart(2,"0");}
async function generateRecurring(){
  if(ranRecurring||readOnly)return;ranRecurring=true;const cur=ymNow();let added=0;
  for(const r of state.recurring){ if(r.active===false)continue;
    let m=r.lastMonth?nextYM(r.lastMonth):(r.startMonth||cur);
    let guard=0,lastGen=r.lastMonth;
    while(m<=cur&&guard++<12){
      if(state.transactions.some(x=>x.recurringId===r.id&&String(x.date).slice(0,7)===m)){lastGen=m;m=nextYM(m);continue;}
      const day=String(Math.min(28,Math.max(1,Number(r.dayOfMonth)||1))).padStart(2,"0");
      const tx={type:r.kind||"expense",amount:Number(r.amount)||0,date:m+"-"+day,category:r.category||"other",taxRate:Number(r.taxRate)||0,projectId:r.projectId||null,clientId:r.clientId||null,description:r.label||"",recurringId:r.id,createdAt:new Date().toISOString()};
      if(tx.type==="income")tx.status="pending";
      let ok=true;
      try{ if(backend==="db")await dbCap.collection("transactions").add(tx); else {state.transactions.push({id:uid(),...tx}); if(!saveLocal()){state.transactions.pop();ok=false;}} }catch(e){ok=false;}
      if(!ok)break;
      added++; lastGen=m; m=nextYM(m);
    }
    if(lastGen&&lastGen!==r.lastMonth){ const rd={...r,lastMonth:lastGen,updatedAt:new Date().toISOString()};delete rd.id; try{await setRec("recurring",r.id,rd,true);}catch(e){} }
  }
  if(added){ if(backend==="local")saveLocal(); render(); toast(added+" "+L("generated_n")); }
}

const COLLS=["clients","projects","transactions","members","tasks","invoices","recurring"];
function loadLocal(){

  catch(e){ loadFailed=true; return; }
  if(d&&typeof d==="object"){ COLLS.forEach(k=>{ if(Array.isArray(d[k]))state[k]=d[k]; }); if(d.settings)state.settings={...state.settings,...d.settings}; }

}
function saveLocal(){
  if(loadFailed)return false;
  try{
    const payload=JSON.stringify({app:"mizan",version:2,clients:state.clients,projects:state.projects,transactions:state.transactions,members:state.members,tasks:state.tasks,invoices:state.invoices,recurring:state.recurring,settings:state.settings});
    const prev=localStorage.getItem("mizan_data");
    localStorage.setItem("mizan_data",payload);
    try{ if(prev&&prev!==payload)localStorage.setItem("mizan_data_prev",prev); }catch(e){}
    try{ localStorage.setItem("mizan_settings",JSON.stringify(state.settings)); }catch(e){}
    if(!storageOK){storageOK=true;}
    return true;
  }catch(e){ storageOK=false; return false; }
}
function storageFail(){ storageOK=false; return {code:"storage",message:L("storage_err")}; }
function actLabel(c,d){if(!d)return"";if(c==="invoices")return (d.kind==="quote"?"QUO":"INV")+"-"+String(d.seq||0).padStart(4,"0");return d.name||d.title||d.label||d.description||(d.amount!=null?fmtNum(d.amount)+" "+L("curr"):"");}
async function addRec(c,d,silent){

}
async function setRec(c,id,d,silent){
  if(backend==="db"){ try{ await dbCap.collection(c).doc(id).update(d); }catch(e){ await dbCap.collection(c).doc(id).set(d); } }
  else{ const i=state[c].findIndex(x=>x.id===id); const snap=i>-1?state[c][i]:null;
    if(i>-1)state[c][i]={...state[c][i],...d,id};
    if(!saveLocal()){ if(i>-1)state[c][i]=snap; render(); throw storageFail(); } render(); }
  if(!silent)logAct("act_updated",c,actLabel(c,d));
}
async function delRec(c,id,silent){
  const before=state[c].find(x=>x.id===id);
  if(backend==="db")await dbCap.collection(c).doc(id).delete();
  else{ const snap=state[c].slice(); state[c]=state[c].filter(x=>x.id!==id); if(!saveLocal()){state[c]=snap;render();throw storageFail();} render(); }

}

function periodRange(key){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(key==="month")return[new Date(y,m,1),new Date(y,m+1,1)];
  if(key==="last")return[new Date(y,m-1,1),new Date(y,m,1)];
  if(key==="bimonthly"){const s=m-(m%2);return[new Date(y,s,1),new Date(y,s+2,1)];}
  if(key==="quarter"){const s=Math.floor(m/3)*3;return[new Date(y,s,1),new Date(y,s+3,1)];}

function invStatus(inv){if((inv.kind||"invoice")==="quote")return inv.status||"draft";if(inv.status==="paid")return"paid";if(inv.status!=="draft"&&inv.dueDate&&inv.dueDate<todayISO())return"overdue";return inv.status||"draft";}
function nextInvoiceSeq(kind){kind=kind||"invoice";const k=kind==="quote"?"lastQuoteSeq":"lastInvoiceSeq";const live=state.invoices.filter(i=>(i.kind||"invoice")===kind).reduce((m,i)=>Math.max(m,Number(i.seq)||0),0);return Math.max(Number(state.settings[k])||0,live)+1;}

function taskRunning(t){return !!t.timerStart;}
function elapsedHours(t){return t.timerStart?(Date.now()-new Date(t.timerStart).getTime())/3600000:0;}
async function startTimer(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const d={...t,timerStart:new Date().toISOString(),status:t.status==="todo"?"doing":(t.status||"doing"),updatedAt:new Date().toISOString()};delete d.id;await setRec("tasks",id,d,true);}
async function stopTimer(id){const t=state.tasks.find(x=>x.id===id);if(!t||!t.timerStart)return;const d={...t,loggedHours:Math.round(((Number(t.loggedHours)||0)+elapsedHours(t))*100)/100,timerStart:null,updatedAt:new Date().toISOString()};delete d.id;await setRec("tasks",id,d,true);}
function updateTimers(){document.querySelectorAll("[data-tstart]").forEach(el=>{const s=el.getAttribute("data-tstart"),base=Number(el.getAttribute("data-base"))||0;const v=base+(Date.now()-new Date(s).getTime())/3600000;el.textContent=v.toFixed(2)+(lang==="ar"?" "+L("h_short"):L("h_short"));});}
function manageTimerTick(){const any=state.tasks.some(t=>t.timerStart);if(any&&!timerTick){timerTick=setInterval(updateTimers,1000);updateTimers();}else if(!any&&timerTick){clearInterval(timerTick);timerTick=null;}}

function areaChart(){
  const months=[];const now=new Date();
  for(let i=chartMonths-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:ym(d),label:d.toLocaleDateString(lang==="ar"?"ar-JO-u-nu-latn":"en-US",{month:"short"})});}
  const data=months.map(m=>{let inc=0,exp=0;for(const t of state.transactions){if(String(t.date).slice(0,7)!==m.key)continue;if(t.type==="income"){if(isReceived(t))inc+=+t.amount||0;}else exp+=+t.amount||0;}return{...m,inc,exp};});
  const W=640,H=206,padX=26,padT=18,padB=30,max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const n=data.length,plotW=W-padX*2,plotH=H-padT-padB;
  const X=i=>padX+(n<=1?plotW/2:plotW*i/(n-1)),Y=v=>padT+plotH-(v/max)*plotH;
  const incPts=data.map((d,i)=>[X(i),Y(d.inc)]),expPts=data.map((d,i)=>[X(i),Y(d.exp)]);
  const smooth=pts=>{if(pts.length<2)return pts.length?`M${pts[0][0]},${pts[0][1]}`:"";let dd=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;dd+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return dd;};
  const incLine=smooth(incPts),expLine=smooth(expPts),baseY=padT+plotH;
  const area=incLine?`${incLine} L${X(n-1)},${baseY} L${X(0)},${baseY} Z`:"";
  const grid=[0,.5,1].map(f=>`<line x1="${padX}" x2="${W-padX}" y1="${padT+plotH*f}" y2="${padT+plotH*f}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`).join("");
  const labels=data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--on-dark-soft)" font-family="var(--font)">${esc(d.label)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="incg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart-inc)" stop-opacity=".32"/><stop offset="1" stop-color="var(--chart-inc)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path class="afill" d="${area}" fill="url(#incg)"/>`:""}
    ${expLine?`<path class="aline" pathLength="1" d="${expLine}" fill="none" stroke="var(--chart-exp)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${incLine?`<path class="aline" pathLength="1" d="${incLine}" fill="none" stroke="var(--chart-inc)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 4px 10px rgba(142,162,255,.4))"/>`:""}
    ${incPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--dark)" stroke="var(--chart-inc)" stroke-width="2"/>`).join("")}
    ${labels}</svg>`;
}

const sortState={};
function sortTable(tbl,key){const s=sortState[tbl]||{};if(s.key===key)s.dir=s.dir==="asc"?"desc":"asc";else{s.key=key;s.dir="asc";}sortState[tbl]=s;render();}
function th(tbl,key,label,cls){const s=sortState[tbl]||{};const on=s.key===key;return `<th class="${cls||''} sortable ${on?'on':''}" title="${esc(L("sort_hint"))}" aria-sort="${on?(s.dir==='asc'?'ascending':'descending'):'none'}"><button type="button" class="thbtn" onclick="sortTable('${tbl}','${key}')"><span>${esc(label)}</span>${on?(s.dir==='asc'?I.sortup:I.sortdown):''}</button></th>`;}
function applySort(tbl,rows,defKey,defDir){if(!sortState[tbl])sortState[tbl]={key:defKey,dir:defDir||"asc"};const s=sortState[tbl];const k=s.key,dir=s.dir==="desc"?-1:1;return rows.slice().sort((a,b)=>{const x=a._s[k],y=b._s[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==="number"&&typeof y==="number")return (x-y)*dir;return String(x).localeCompare(String(y))*dir;});}
function vatHelp(){const a=num("f_amount"),r=num("f_vat"),el=document.getElementById("vatHelp");if(!el)return;if(a>0&&r>0){el.textContent=fmtNum(a)+" "+L("curr")+" "+L("includes_vat")+" "+fmtNum(a-a/(1+r/100))+" "+L("curr")+" "+L("vat")+" ("+r+"%)";}else el.textContent="";}

function txView(type){
  const isInc=type==="income",key=isInc?"incSearch":"expSearch",q=filters[key].toLowerCase();
  const tbl=isInc?"income":"expenses",TR={overdue:0,pending:1,received:2};
  const rows=state.transactions.filter(t=>t.type===type).filter(t=>!q||[catLabel(t.category),t.description,projName(t.projectId),clientName(t.clientId)].some(v=>String(v||"").toLowerCase().includes(q))).map(t=>({t,_s:{date:t.date||"",category:catLabel(t.category),project:(projName(t.projectId)||clientName(t.clientId)||"").toLowerCase(),status:TR[txStatus(t)]!=null?TR[txStatus(t)]:9,amount:+t.amount||0}}));
  const list=applySort(tbl,rows,"date","desc").map(r=>r.t);
  const sum=list.reduce((a,t)=>a+(isInc?(isReceived(t)?+t.amount||0:0):+t.amount||0),0);
  const toolbar=`<div class="toolbar"><div class="search">${I.search}<input id="${isInc?'incSearch':'expSearch'}" placeholder="${esc(L("search_tx"))}" value="${esc(filters[key])}"></div><div class="totaltag">${esc(isInc?L("received"):L("total"))}: <span class="money ${isInc?'pos':'neg'}" style="margin-inline-start:6px">${money(sum)}</span></div></div>`;
  if(!list.length&&!filters[key])return emptyState(isInc?"no_income_h":"no_expenses_h",isInc?"no_income_p":"no_expenses_p",readOnly?"":`<button class="btn accent" onclick="openTx('${type}')">${I.plus}${esc(isInc?L("add_income"):L("add_expense"))}</button>`);
  const body=list.map(t=>{const pn=projName(t.projectId),cn=clientName(t.clientId),st=txStatus(t);
    return `<tr><td class="muted fit" style="white-space:nowrap"><div class="strong" style="color:var(--ink);display:block">${fmtDate(t.date)}</div>${isInc&&t.status==="pending"&&t.dueDate?`<div class="rowsub">${esc(L("due_date"))}: ${fmtDate(t.dueDate)}</div>`:""}<div class="rowsub m-only">${esc(catLabel(t.category))}${pn?` · <bdi>${esc(pn)}</bdi>`:""}</div></td>
      <td class="hide-m"><div class="strong">${esc(catLabel(t.category))}</div>${t.description?`<div class="rowsub">${esc(t.description)}</div>`:(t.taxRate?`<div class="rowsub">${esc(L("vat"))} ${t.taxRate}%</div>`:"")}</td>
      <td class="hide-m">${pn?`<bdi>${esc(pn)}</bdi>`:`<span class="muted">${esc(L("no_project"))}</span>`}${cn&&cn!==pn?`<div class="rowsub"><bdi>${esc(cn)}</bdi></div>`:""}</td>
      ${isInc?`<td class="fit hide-m">${st?`<span class="pill ${st}">${esc(L("st_"+st))}</span>`:""}${st==='overdue'||st==='pending'?(readOnly?"":`<button class="btn sm" style="margin-inline-start:6px;padding:4px 8px" onclick="markReceived('${t.id}')">${esc(L("mark_received"))}</button>`):""}</td>`:""}
      <td class="r fit amt-cell"><span class="money ${isInc?(st==='overdue'?'neg':'pos'):'neg'}">${money(t.amount)}</span>${isInc&&st&&st!=='received'?`<div class="rowsub m-only"><span class="pill ${st}" style="font-size:10px;padding:2px 7px">${esc(L("st_"+st))}</span></div>`:""}</td>
      <td class="r rowacts">${rowActions(`openTx('${type}','${t.id}')`,`confirmDel('transactions','${t.id}')`,catLabel(t.category)+" "+money(t.amount))}</td></tr>`;}).join("");
  const miss=`<tr><td colspan="${isInc?6:5}" class="empty">${esc(L("no_match").replace("{q}",filters[key]))} <button class="btn sm" style="margin-inline-start:8px" onclick="filters['${key}']='';render()">${esc(L("clear_search"))}</button></td></tr>`;
  const head=`<tr>${th(tbl,"date",L("date"),"fit")}${th(tbl,"category",L("category"))}${th(tbl,"project",L("project"))}${isInc?th(tbl,"status",L("status"),"fit"):""}${th(tbl,"amount",L("amount"),"r fit")}<th></th></tr>`;
  return toolbar+`<div class="card"><div class="wrap"><table class="stack"><thead>${head}</thead><tbody>${body||miss}</tbody></table></div></div>`;

function reportsView(){
  if(!state.transactions.length)return emptyState("no_income_h","no_income_p",readOnly?"":`<button class="btn accent" onclick="openTx('income')">${I.plus}${esc(L("add_income"))}</button>`);

    <div class="print-only" style="font-weight:600">${esc(state.settings.company||L("appName"))} · ${esc(L("period"))}: ${esc(L("p_"+reportPeriod))} · ${esc(L("generated"))} ${fmtDate(todayISO())}</div></div>`;

    <div class="line"><span class="k">${esc(L("total_income"))}</span><span class="money pos">${money(t.inc)}</span></div>
    <div class="line"><span class="k">${esc(L("total_expenses"))}</span><span class="money neg">${money(t.exp)}</span></div>
    <div class="line total"><span class="k">${esc(L("net_profit"))}</span><span class="money ${t.net>=0?'pos':'neg'}">${money(t.net,true)}</span></div>
    <div class="line"><span class="k">${esc(L("margin"))}</span><span class="money" dir="ltr">${margin}%</span></div>
    ${t.out>0?`<div class="line"><span class="k">${esc(L("outstanding"))} (${esc(L("to_collect"))})</span><span class="money warn" style="color:var(--warn)">${money(t.out)}</span></div>`:""}</div>`;
  const vat=`<div class="card pnl"><h2>${esc(L("vat_summary"))}</h2>
    <div class="line"><span class="k">${esc(L("vat_collected"))}</span><span class="money pos">${money(vatCol)}</span></div>
    <div class="line"><span class="k">${esc(L("vat_paid"))}</span><span class="money neg">${money(vatPaid)}</span></div>
    <div class="line total"><span class="k">${esc(L("vat_net"))}</span><span class="money ${vatCol-vatPaid>=0?'':'neg'}">${money(vatCol-vatPaid,true)}</span></div>
    <div class="line"><span class="k muted" style="font-size:12px">${esc(L("vat_rate"))}</span><span class="muted" style="font-size:12px">${esc(state.settings.vatRate)}% ${esc(L("vat"))}</span></div></div>`;
  const catAgg=(type)=>{const m={};for(const x of list){if(x.type!==type)continue;if(type==="income"&&!isReceived(x))continue;m[x.category]=(m[x.category]||0)+(+x.amount||0);}return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const incCats=catAgg("income"),expCats=catAgg("expense");
  const catCard=(title,cats,color)=>{const max=Math.max(1,...cats.map(c=>c[1]));return `<div class="card catbar"><div class="card-h" style="padding:2px 0 12px"><h2>${esc(title)}</h2></div>${cats.length?cats.map(([k,v])=>`<div class="catrow"><div class="ct"><span class="k">${esc(catLabel(k))}</span><span class="money">${money(v)}</span></div><div class="bar"><i style="width:${v/max*100}%;background:${color}"></i></div></div>`).join(""):`<div class="muted" style="padding:8px 0">${esc(L("no_data"))}</div>`}</div>`;};
  const clientAgg={};for(const x of list){if(x.type==="income"&&isReceived(x)&&x.clientId)clientAgg[x.clientId]=(clientAgg[x.clientId]||0)+(+x.amount||0);}
  const topCl=Object.entries(clientAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const clMax=Math.max(1,...topCl.map(c=>c[1]));
  const clientsCard=`<div class="card catbar"><div class="card-h" style="padding:2px 0 12px"><h2>${esc(L("top_clients"))}</h2></div>${topCl.length?topCl.map(([id,v])=>`<div class="catrow"><div class="ct"><span class="k">${esc(clientName(id)||L("none"))}</span><span class="money">${money(v)}</span></div><div class="bar"><i style="width:${v/clMax*100}%;background:var(--accent)"></i></div></div>`).join(""):`<div class="muted" style="padding:8px 0">${esc(L("no_data"))}</div>`}</div>`;
  return seg+`<div class="rgrid" style="margin-bottom:15px">${pnl}${vat}</div><div class="rgrid" style="margin-bottom:15px">${catCard(L("income_by_cat"),incCats,'var(--pos)')}${catCard(L("expense_by_cat"),expCats,'var(--neg)')}</div>${clientsCard}`;
}

function invPullHours(){const cid=val("iv_client");if(!cid){shake("iv_client");return;}
  const tasks=unbilledTasksForClient(cid).filter(t=>!window._invItems.some(it=>it._taskId===t.id));
  if(!tasks.length){toast(L("no_unbilled"));return;}
  let added=0,skipped=0;
  tasks.forEach(t=>{const rate=memberBillRate(t.assigneeId);if(!rate){skipped++;return;}const hrs=Number(t.loggedHours)||0;window._invItems.push({desc:t.title+" ("+hrs+"h)",qty:hrs,rate,_taskId:t.id});added++;});
  document.getElementById("invItems").innerHTML=invItemsHTML();invRecalc();
  toast(added?(added+" · "+L("unbilled")+(skipped?" (+"+skipped+" @0)":"")):L("no_unbilled"));}
async function markInvoicePaid(id){const inv=state.invoices.find(x=>x.id===id);if(!inv)return;

      if(backend==="db"){const ref=await dbCap.collection("transactions").add(tx);d.paidTransactionId=ref.id;}else{const nid=uid();state.transactions.push({id:nid,...tx});if(!saveLocal()){state.transactions.pop();throw storageFail();}d.paidTransactionId=nid;}}

function exportBackup(){try{const data={app:"mizan",version:1,exportedAt:new Date().toISOString(),clients:state.clients,projects:state.projects,transactions:state.transactions,members:state.members,tasks:state.tasks,invoices:state.invoices,recurring:state.recurring,settings:state.settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="mizan-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);try{localStorage.setItem("mizan_lastBackup",String(Date.now()));}catch(e){}toast(L("exported"));render();}catch(e){toast("Export not available here");}}
let _pendingImport=null;
function importBackupFile(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let d=null;try{d=JSON.parse(r.result);}catch(e){toast("Bad file");return;}
    if(!d||typeof d!=="object"||Array.isArray(d)||!COLLS.some(k=>Array.isArray(d[k]))){toast("Bad file");return;}
    _pendingImport=d;confirmImport();};
  r.readAsText(f);input.value="";}
function confirmImport(){const d=_pendingImport||{};
  const counts=COLLS.filter(k=>Array.isArray(d[k])&&d[k].length).map(k=>`${d[k].length} ${esc(L("nav_"+k)||k)}`).join(" · ")||"—";
  modalHost().innerHTML=shell(L("import_backup"),`<div class="modal-b"><p style="margin:6px 0 8px;font-size:15px;font-weight:600">${esc(L("import_confirm"))}</p><div class="tag" style="display:block;padding:10px 12px;line-height:1.7">${counts}</div></div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">${esc(L("cancel"))}</button><button type="button" class="btn" id="mSubmit" style="background:var(--neg);border-color:var(--neg);color:#fff">${esc(L("import_backup"))}</button></div>`);
  document.getElementById("mSubmit").onclick=()=>applyImport();}
function dismissNote(){noteDismissed=true;try{localStorage.setItem("mizan_note_dismissed","1");}catch(e){}render();}
async function applyImport(){const d=_pendingImport;if(!d)return;const b=document.getElementById("mSubmit");if(b)b.disabled=true;
  try{["clients","projects","transactions","members","tasks","invoices","recurring"].forEach(k=>{if(Array.isArray(d[k]))state[k]=d[k];});if(d.settings)state.settings={...state.settings,...d.settings};
    if(backend==="db"){for(const k of ["clients","projects","transactions","members","tasks","invoices","recurring"]){if(Array.isArray(d[k]))for(const it of d[k]){const id=it.id;if(!id)continue;const body={...it};delete body.id;try{await dbCap.collection(k).doc(id).set(body);}catch(e){}}}try{await dbCap.doc("settings/app").set(state.settings);}catch(e){}}else{loadFailed=false;if(!saveLocal())throw storageFail();}
    closeModal();render();toast(L("restored"));
  }catch(e){if(b)b.disabled=false;toast((e&&e.message)||"Error");}}

function shell(title,body){

}
function trapTab(e){ const m=document.querySelector(".modal"); if(!m)return; const f=[...m.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null); if(!f.length)return; const first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();} else if(!m.contains(document.activeElement)){e.preventDefault();first.focus();} }

function exportCSV(){
  const list=state.transactions.filter(t=>inPeriod(t,reportPeriod)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const head=["Date","Type","Category","Project","Client","Amount (JOD)","VAT %","Status","Description"];
  const rows=list.map(t=>[t.date,t.type,catLabel(t.category),projName(t.projectId)||"",clientName(t.clientId)||"",(+t.amount||0).toFixed(3),t.taxRate||0,t.type==="income"?(t.status||"received"):"",(t.description||"").replace(/[\r\n]+/g," ")]);
  const csv=[head,...rows].map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\r\n");
  try{
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`mizan-${reportPeriod}-${todayISO()}.csv`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
    toast(L("export_csv"));
  }catch(e){toast("Export not available here");}
}

  const nav=[];
  NAV.forEach(([k,ic,lk])=>{nav.push({icon:ic,t:L(lk),s:L("go_to"),run:()=>{closePalette();go(k);}});(SUBS[k]||[]).forEach(s=>nav.push({icon:ic,t:L(lk)+" · "+L(SUBLABEL[s]),s:L("go_to"),run:()=>{closePalette();go(k,s);}}));});
  const match=it=>!q||(it.t+" "+it.s).toLowerCase().includes(q);
  const data=[];
  if(q){ const push=(it)=>{if(data.length<12&&match(it))data.push(it);};
    state.clients.forEach(c=>push({icon:I.clients,t:c.name,s:L("client"),run:()=>{closePalette();openClientDetail(c.id);}}));
    state.projects.forEach(p=>push({icon:I.projects,t:p.name,s:L("project")+(clientName(p.clientId)?" · "+clientName(p.clientId):""),run:()=>{closePalette();openProjectDetail(p.id);}}));
    state.invoices.forEach(inv=>push({icon:I.invoices,t:invNumber(inv)+" · "+(clientName(inv.clientId)||""),s:inv.kind==="quote"?L("quote"):L("invoice"),run:()=>{closePalette();viewInvoice(inv.id);}}));
    state.tasks.forEach(t=>push({icon:I.tasks,t:t.title,s:L("nav_tasks"),run:()=>{closePalette();go('tasks');setTimeout(()=>openTask(t.id),50);}}));
  }
  return {quick:qa.filter(match),nav:nav.filter(match),data};
}
function palRow(it,idx){return `<div class="pal-it ${idx===palSel?'sel':''}" onclick="palRun(${idx})" ${KB}><span class="pi">${it.icon}</span><div style="min-width:0"><div class="pt">${esc(it.t)}</div><div class="ps">${esc(it.s)}</div></div></div>`;}
function palListHTML(){
  const g=palItems();window._palFlat=[...g.quick,...g.nav,...g.data];
  if(palSel>=window._palFlat.length)palSel=Math.max(0,window._palFlat.length-1);
  if(!window._palFlat.length)return `<div class="pal-empty">${esc(L("no_results"))}</div>`;
  const sec=(title,arr,start)=>arr.length?`<div class="pal-sec">${esc(title)}</div>`+arr.map((it,i)=>palRow(it,start+i)).join(""):"";
  let idx=0,html="";
  html+=sec(L("quick_actions"),g.quick,idx);idx+=g.quick.length;
  html+=sec(L("go_to"),g.nav,idx);idx+=g.nav.length;
  html+=g.data.map((it,i)=>palRow(it,idx+i)).join("");
  return html;
}
function palette(){return `<div class="palscrim" onclick="if(event.target===this)closePalette()"><div class="pal"><div class="pal-in">${I.search}<input id="palInput" placeholder="${esc(L("search_all"))}" value="${esc(palQuery)}" autocomplete="off"></div><div class="pal-list" id="palList">${palListHTML()}</div></div></div>`;}
function updatePaletteList(){const el=document.getElementById("palList");if(el)el.innerHTML=palListHTML();}
function palRun(i){const it=window._palFlat&&window._palFlat[i];if(it)it.run();}
function palKey(e){if(!paletteOpen)return;if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min((window._palFlat.length||1)-1,palSel+1);updatePaletteList();}else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);updatePaletteList();}else if(e.key==="Enter"){e.preventDefault();palRun(palSel);}else if(e.key==="Escape"){e.preventDefault();closePalette();}}
let gPend=false;
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();paletteOpen?closePalette():openPalette();return;}
  if(modalHost().innerHTML){ if(e.key==="Escape"){e.preventDefault();requestClose();return;} if(e.key==="Tab"){trapTab(e);} if(e.key==="Enter"){const t=e.target,tag=(t&&t.tagName||"").toLowerCase();
      if(t&&t.closest&&t.closest('.ivrow')){e.preventDefault();const ins=[...document.querySelectorAll('.ivrow:not(.ivhead) input')];const i=ins.indexOf(t);if(i>=0&&i===ins.length-1){invAddItem();const all=document.querySelectorAll('.ivrow:not(.ivhead) input');const d=all[all.length-3];if(d)d.focus();}else if(i>=0)ins[i+1].focus();return;}
      if(tag==="input"&&t.type!=="date"){const b=document.getElementById("mSubmit");if(b){e.preventDefault();b.click();}}} return; }
  const tag=(e.target&&e.target.tagName||"").toLowerCase();const typing=tag==="input"||tag==="textarea"||tag==="select";
  if(typing||paletteOpen)return;
  if(e.key==="/"){e.preventDefault();openPalette();return;}
  if(e.key.toLowerCase()==="g"&&!e.metaKey&&!e.ctrlKey){gPend=true;setTimeout(()=>gPend=false,800);return;}
  if(gPend){const mp={h:"dashboard",d:"dashboard",m:"money",w:"work",c:"clients",s:"settings",p:"projects",t:"tasks",v:"invoices",q:"quotes",i:"income",e:"expenses",r:"reports"};const k=mp[e.key.toLowerCase()];if(k)go(k);gPend=false;return;}
  if(e.key.toLowerCase()==="n"&&!readOnly){const m={clients:openClient,projects:openProject,tasks:openTask,team:openMember,invoices:()=>openInvoice(null,'invoice'),quotes:()=>openInvoice(null,'quote'),income:()=>openTx('income'),expenses:()=>openTx('expense'),dashboard:openQuick};const f=m[viewKey()];if(f)f();}
});
function countUp(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const els=document.querySelectorAll(".count[data-to]");
  els.forEach(el=>{
    const to=Number(el.dataset.to)||0,dec=Number(el.dataset.dec)||0,prefix=el.dataset.prefix||"";
    if(to===0)return; const dur=650,t0=performance.now();
    function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),cur=to*e;
      el.textContent=prefix+cur.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}
let toastTimer;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2400);}

/* ===================== boot ===================== */
applyHash();try{history.replaceState({v:view},"",routeHash());}catch(e){}
render();
initStore();
</script>
