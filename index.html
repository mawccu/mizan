<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light dark;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Mizan Accounts</title>
<meta name="description" content="Bilingual company accounting: clients, projects, income and expenses with per-project profit, in JOD.">
<style>
  :root{
    --canvas:#f4f5f7; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eceef1;
    --ink:#1b1f27; --ink-soft:#5d636f; --ink-faint:#989ea9;
    --line:#e9eaee; --line-2:#e0e2e7;
    --accent:#33519e; --accent-2:#5f79bd; --accent-3:#aeb9d6; --accent-4:#26407e; --accent-soft:#eceff6;
    --dark:#12151c; --dark-2:#1a1e27; --on-dark:#f2f3f6; --on-dark-soft:#8b93a5;
    --pos:#157a52; --pos-soft:#e8f2ec; --neg:#b0473f; --neg-soft:#f6eae8; --warn:#8f6a1c; --warn-soft:#f6efe0;
    --pill:#1b1f27;
    --r-card:13px; --r-mid:10px; --r-sm:8px;
    --shadow:0 1px 2px rgba(24,28,38,.05), 0 6px 20px rgba(24,28,38,.05);
    --shadow-sm:0 1px 1px rgba(24,28,38,.04);
    --disp:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
    --font:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  :root[data-theme="dark"]{
    --canvas:#0c0e12; --surface:#14171d; --surface-2:#191d24; --surface-3:#212630;
    --ink:#e9ebf0; --ink-soft:#98a0ad; --ink-faint:#646c7a;
    --line:#222732; --line-2:#2a303c;
    --accent:#6f8bd6; --accent-2:#8298cf; --accent-3:#37436a; --accent-4:#aebbe0; --accent-soft:#1c2436;
    --dark:#171a22; --dark-2:#1e222c; --on-dark:#eef0f4; --on-dark-soft:#8b93a5;
    --pos:#3aa877; --pos-soft:#13271e; --neg:#cf6b64; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2b2415;
    --pill:#e9ebf0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.38);
    --shadow-sm:0 1px 1px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){
    --canvas:#0c0e12; --surface:#14171d; --surface-2:#191d24; --surface-3:#212630;
    --ink:#e9ebf0; --ink-soft:#98a0ad; --ink-faint:#646c7a; --line:#222732; --line-2:#2a303c;
    --accent:#6f8bd6; --accent-4:#aebbe0; --accent-soft:#1c2436; --dark:#171a22; --dark-2:#1e222c;
    --pos:#3aa877; --pos-soft:#13271e; --neg:#cf6b64; --neg-soft:#2c1b1a; --warn:#c99b4c; --warn-soft:#2b2415; --pill:#e9ebf0;
  }}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}

  /* layout */
  .app{display:grid;grid-template-columns:80px 1fr;min-height:100%}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
    gap:8px;padding:20px 0}
  .rail-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent-4));
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(63,104,255,.35);margin-bottom:14px}
  .rail-logo svg{width:22px;height:22px}
  .rail-nav{display:flex;flex-direction:column;gap:8px;flex:1}
  .rbtn{width:44px;height:44px;border-radius:11px;border:none;background:transparent;color:var(--ink-soft);
    display:grid;place-items:center;transition:.15s;position:relative}
  .rbtn svg{width:21px;height:21px}
  .rbtn:hover{background:var(--surface);color:var(--ink)}
  .rbtn.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .rbtn.on{background:var(--accent);color:#fff}
  .rbtn .tip{position:absolute;inset-inline-start:56px;top:50%;transform:translateY(-50%);background:var(--ink);
    color:var(--canvas);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.12s;z-index:30}
  [dir=rtl] .rbtn .tip{inset-inline-start:auto;inset-inline-end:56px}
  .rbtn:hover .tip{opacity:1}
  .rail-foot{display:flex;flex-direction:column;gap:8px;align-items:center}

  .main{min-width:0;padding:22px 26px 40px;max-width:1500px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
  .topbar h1{font-size:21px}
  .topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:2px;font-weight:500}
  .topcluster{display:flex;align-items:center;gap:10px}

  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:12px;
    font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
    font-family:var(--disp)}
  .btn svg{width:16px;height:16px}
  .btn:hover{border-color:var(--ink);color:var(--ink)}
  .btn.primary{background:var(--pill);border-color:var(--pill);color:var(--canvas)}
  :root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.9}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface);color:var(--ink)}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.danger:hover{border-color:var(--neg);color:var(--neg)}

  .lang-toggle{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:3px;gap:2px}
  .lang-toggle button{border:none;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:12.5px;
    color:var(--ink-soft);font-family:var(--disp)}
  .lang-toggle button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .lang-toggle button.on{background:var(--accent);color:#fff}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);
    color:var(--ink-soft);display:grid;place-items:center;transition:.15s}
  .iconbtn:hover{color:var(--ink);border-color:var(--ink)}
  .iconbtn svg{width:18px;height:18px}

  /* cards */
  .card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 4px}
  .card-h h2{font-size:16px}
  .card-h .hint,.card-h .link{font-size:12px;color:var(--ink-faint);font-weight:600}
  .card-h .link{cursor:pointer} .card-h .link:hover{color:var(--accent)}

  /* dashboard grid */
  .dgrid{display:grid;grid-template-columns:1.85fr 1fr;gap:16px;align-items:start}
  .dleft{display:flex;flex-direction:column;gap:16px;min-width:0}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 18px 20px;
    box-shadow:var(--shadow-sm)}
  .stat .top{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:13px;font-weight:600}
  .stat .ic{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-soft);background:var(--surface-2)}
  .stat .ic svg{width:16px;height:16px}
  .stat .big{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-top:16px;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap}
  .stat.pos .ic{color:var(--pos)}
  .stat.neg .ic{color:var(--neg)}
  .stat.acc .ic{color:var(--accent)}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);
    font-family:var(--disp);border:1px solid var(--line-2)}
  .badge.pos{background:var(--pos-soft);color:var(--pos);border-color:transparent} .badge.neg{background:var(--neg-soft);color:var(--neg);border-color:transparent}

  /* dark hero */
  .hero{background:var(--dark);border-radius:var(--r-card);padding:20px 22px 14px;color:var(--on-dark);
    border:1px solid rgba(255,255,255,.04)}
  .hero-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .hero-h h2{font-size:16px;color:#fff}
  .tf{display:flex;background:rgba(255,255,255,.08);border-radius:11px;padding:3px}
  .tf button{border:none;background:transparent;color:var(--on-dark-soft);padding:6px 12px;border-radius:8px;
    font-weight:700;font-size:12px;font-family:var(--disp)}
  .tf button.on{background:#fff;color:var(--dark)}
  .hero svg.chart{width:100%;height:210px;display:block;overflow:visible}
  .hero-legend{display:flex;gap:16px;padding:8px 2px 4px;font-size:12px;color:var(--on-dark-soft);font-weight:600}
  .hero-legend span{display:inline-flex;align-items:center;gap:7px}
  .hero-legend i{width:9px;height:9px;border-radius:3px}

  /* net position card */
  .net{padding:20px 20px 22px;display:flex;flex-direction:column;height:100%}
  .net .lbl{display:flex;align-items:center;justify-content:space-between}
  .net .lbl span{color:var(--ink-soft);font-weight:600;font-size:13.5px}
  .net .big{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:-.025em;margin:13px 0 4px;line-height:1;font-variant-numeric:tabular-nums}
  .net .allsub{color:var(--ink-faint);font-size:12px;font-weight:600;margin-bottom:16px}
  .segbar{height:12px;border-radius:20px;overflow:hidden;display:flex;background:var(--surface-3);margin-bottom:16px}
  .segbar i{height:100%}
  .brk{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
  .brk .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
  .brk .row:first-child{border-top:none}
  .brk .k{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink-soft);font-size:13px}
  .brk .k i{width:9px;height:9px;border-radius:50%}
  .brk .v{font-family:var(--disp);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .net .btn{justify-content:center;margin-top:auto}

  /* lists / tables */
  .list{padding:6px 8px 10px}
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;transition:.12s}
  .lrow:hover{background:var(--surface-2)}
  .lrow .av{width:36px;height:36px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--disp)}
  .lrow .mid{flex:1;min-width:0}
  .lrow .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .s{font-size:11.5px;color:var(--ink-faint);font-weight:500}
  .amt{font-family:var(--disp);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}

  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);
    font-weight:700;padding:12px 18px;white-space:nowrap}
  td{padding:13px 18px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:end}
  .money{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .money.pos{color:var(--pos)} .money.neg{color:var(--neg)}
  .muted{color:var(--ink-faint)} .strong{font-weight:700} .rowsub{font-size:11.5px;color:var(--ink-faint)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.active{background:var(--pos-soft);color:var(--pos)}
  .pill.completed{background:var(--accent-soft);color:var(--accent-4)}
  .pill.on_hold{background:var(--warn-soft);color:var(--warn)}
  .tag{display:inline-flex;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:700;background:var(--surface-2);
    color:var(--ink-soft)}
  .avatar{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-4);display:inline-grid;
    place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;font-family:var(--disp)}
  .cellflex{display:flex;align-items:center;gap:11px}

  .empty{padding:44px 20px;text-align:center;color:var(--ink-faint)}
  .empty .eic{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px}
  .empty .eic svg{width:24px;height:24px;opacity:.6}
  .empty h3{font-size:16px;color:var(--ink-soft);margin-bottom:5px}
  .empty p{margin:0 0 16px;font-size:13px}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface);color:var(--ink)}
  .search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-faint)}
  [dir=rtl] .search input{padding:11px 40px 11px 14px}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;padding:3px}
  .seg button{border:none;background:transparent;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink-soft);border-radius:10px;font-family:var(--disp)}
  .seg button.on{background:var(--ink);color:var(--canvas)}
  :root[data-theme="dark"] .seg button.on{background:var(--accent);color:#fff}
  .totaltag{background:var(--surface);border:1px solid var(--line-2);border-radius:13px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink-soft)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(16,18,26,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(540px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px;position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-h h2{font-size:19px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);color:var(--ink);transition:.14s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
  .field textarea{resize:vertical;min-height:66px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-b{padding:6px 22px 4px} .modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
  .close{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink-soft)}
  .close:hover{color:var(--ink)} .close svg{width:18px;height:18px}

  .toast{position:fixed;inset-block-end:24px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--canvas);padding:12px 20px;border-radius:13px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:80;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-family:var(--disp)}
  .toast.show{opacity:1;transform:translateY(0)}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:11px 16px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:flex;gap:9px;align-items:center}
  .banner svg{width:16px;height:16px;flex:0 0 auto}

  .mobile-top{display:none}
  .botnav{display:none}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  @media (max-width:1050px){
    .dgrid{grid-template-columns:1fr}
    .grid3{grid-template-columns:1fr 1fr}
  }
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .rail{display:none}
    .mobile-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
    .main{padding:16px 16px 92px;max-width:none}
    .topbar h1{font-size:22px}
    .stat3{grid-template-columns:1fr 1fr}
    .grid3{grid-template-columns:1fr}
    .lt-desktop{display:none}
    .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-2);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px rgba(16,20,30,.06)}
    .botnav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;color:var(--ink-faint);font-size:10px;font-weight:700;transition:.12s;line-height:1;font-family:var(--disp)}
    .botnav button.on{color:var(--accent)}
    .botnav svg{width:21px;height:21px}
  }
  @media (max-width:480px){ .stat3{grid-template-columns:1fr} .net .big{font-size:32px} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div id="root" class="app"></div>
<div id="modal-host"></div>

/* ===================== State / store ===================== */
const state={ clients:[], projects:[], transactions:[] };
let view="dashboard", readOnly=false, backend="loading", dbCap=null, userCap=null, chartMonths=6;
const filters={ clientSearch:"", projSearch:"", incSearch:"", expSearch:"", projStatus:"all" };
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function initStore(){
  try{ dbCap=await claude.use("db"); }catch(e){ dbCap=null; }
  try{
    userCap=await claude.use("user");
    if(userCap){ const cw=userCap.can?userCap.can("data.write"):true; if(cw===false) readOnly=true; }
  }catch(e){ userCap=null; }
  if(dbCap){ backend="db"; ["clients","projects","transactions"].forEach(subscribe); render(); }
  else{ backend="local"; loadLocal(); render(); }
}
function subscribe(coll){
  try{ dbCap.collection(coll).onSnapshot(
    s=>{ state[coll]=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    e=>{ if(e&&e.code==="revoked"){readOnly=true;render();} }); }catch(e){}
}
function loadLocal(){ try{ const r=localStorage.getItem("mizan_data"); if(r){const d=JSON.parse(r);state.clients=d.clients||[];state.projects=d.projects||[];state.transactions=d.transactions||[];} }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("mizan_data",JSON.stringify(state)); }catch(e){} }
async function addRec(c,d){ if(backend==="db")await dbCap.collection(c).add(d); else{state[c].push({id:uid(),...d});saveLocal();render();} }
async function setRec(c,id,d){ if(backend==="db")await dbCap.collection(c).doc(id).set(d); else{const i=state[c].findIndex(x=>x.id===id);if(i>-1)state[c][i]={id,...d};saveLocal();render();} }
async function delRec(c,id){ if(backend==="db")await dbCap.collection(c).doc(id).delete(); else{state[c]=state[c].filter(x=>x.id!==id);saveLocal();render();} }

/* ===================== helpers ===================== */
function money(n,sign){ n=Number(n)||0; const s=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3}); const p=sign&&n>0?"+":((sign&&n<0)||n<0?"−":""); return `${p}${s} ${L("curr")}`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ const p=String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function fmtDate(d){ if(!d)return"—"; try{return new Date(d+"T00:00:00").toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return d;} }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function clientName(id){ const c=state.clients.find(x=>x.id===id); return c?c.name:null; }
function projName(id){ const p=state.projects.find(x=>x.id===id); return p?p.name:null; }
function projStats(pid){ let inc=0,exp=0; for(const t of state.transactions){ if(t.projectId!==pid)continue; if(t.type==="income")inc+=+t.amount||0; else exp+=+t.amount||0;} return {inc,exp,profit:inc-exp}; }
function totals(){ let inc=0,exp=0; for(const t of state.transactions){ if(t.type==="income")inc+=+t.amount||0; else exp+=+t.amount||0;} return {inc,exp,net:inc-exp}; }

function rail(){

function dashboard(){
  const t=totals();
  const activeCount=state.projects.filter(p=>p.status==="active").length;
  const incCount=state.transactions.filter(x=>x.type==="income").length;
  const expCount=state.transactions.filter(x=>x.type==="expense").length;

  const stats=`<div class="stat3">
    <div class="stat pos"><div class="top"><span class="ic">${I.income}</span>${esc(L("total_income"))}</div><div class="big">${money(t.inc)}<span class="badge pos">${incCount} ${esc(L("entries"))}</span></div></div>

    <div class="stat acc"><div class="top"><span class="ic">${I.projects}</span>${esc(L("active_projects"))}</div><div class="big">${activeCount}<span class="badge">${esc(L("total"))} ${state.projects.length}</span></div></div>
  </div>`;

  const hero=`<div class="hero">
    <div class="hero-h"><h2>${esc(L("perf"))}</h2>
      <div class="tf">${[3,6,12].map(m=>`<button class="${chartMonths===m?'on':''}" onclick="setMonths(${m})">${m===12?'1Y':m+'M'}</button>`).join("")}</div>
    </div>

    <div class="hero-legend"><span><i style="background:#8098c9"></i>${esc(L("income"))}</span><span><i style="background:#c58a7f"></i>${esc(L("expenses"))}</span></div>
  </div>`;

  // net position card
  const gross=t.inc+t.exp;
  const incPct=gross>0?(t.inc/gross*100):50, expPct=gross>0?(t.exp/gross*100):50;
  const net=`<div class="card net">
    <div class="lbl"><span>${esc(L("net_position"))}</span>${!readOnly?`<button class="btn sm" onclick="openTx('income')">${I.plus}${esc(L("add_income"))}</button>`:""}</div>
    <div class="big" style="color:${t.net>=0?'var(--ink)':'var(--neg)'}">${money(t.net,true)}</div>
    <div class="allsub"><span class="badge ${t.net>=0?'pos':'neg'}">${esc(t.net>=0?L("profit"):L("loss"))}</span> · ${esc(L("all_time"))}</div>
    <div class="segbar">${gross>0?`<i style="width:${incPct}%;background:var(--pos)"></i><i style="width:${expPct}%;background:var(--neg)"></i>`:`<i style="width:100%;background:var(--surface-3)"></i>`}</div>
    <div class="brk">
      <div class="row"><span class="k"><i style="background:var(--pos)"></i>${esc(L("income"))}</span><span class="v" style="color:var(--pos)">${money(t.inc)}</span></div>
      <div class="row"><span class="k"><i style="background:var(--neg)"></i>${esc(L("expenses"))}</span><span class="v" style="color:var(--neg)">${money(t.exp)}</span></div>
    </div>
    ${!readOnly?`<button class="btn primary" onclick="openTx('expense')">${I.plus}${esc(L("add_expense"))}</button>`:""}
  </div>`;

  const dgrid=`<div class="dgrid"><div class="dleft">${stats}${hero}</div>${net}</div>`;

  // bottom row
  const recent=[...state.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);
  const recentCard=`<div class="card"><div class="card-h"><h2>${esc(L("recent"))}</h2>${state.transactions.length>5?`<span class="link" onclick="go('income')">${esc(L("view_all"))}</span>`:""}</div>
    <div class="list">${recent.length?recent.map(tx=>{const pn=projName(tx.projectId)||clientName(tx.clientId);return `<div class="lrow"><span class="av">${esc(catLabel(tx.category).slice(0,2))}</span><div class="mid"><div class="t">${esc(catLabel(tx.category))}</div><div class="s">${pn?esc(pn):esc(L("no_project"))} · ${fmtDate(tx.date)}</div></div><span class="amt ${tx.type==='income'?'pos':'neg'}">${tx.type==='income'?'+':'−'}${money(tx.amount).replace('−','')}</span></div>`;}).join(""):emptyMini()}</div></div>`;

  const rows=state.projects.map(p=>({p,...projStats(p.id)})).filter(r=>r.inc||r.exp).sort((a,b)=>b.profit-a.profit).slice(0,5);
  const topCard=`<div class="card"><div class="card-h"><h2>${esc(L("top_projects"))}</h2><span class="hint">${esc(L("profit"))}</span></div>
    <div class="list">${rows.length?rows.map(r=>`<div class="lrow"><span class="av">${esc(initials(r.p.name))}</span><div class="mid"><div class="t">${esc(r.p.name)}</div><div class="s">${esc(clientName(r.p.clientId)||L("none"))}</div></div><span class="amt ${r.profit>=0?'pos':'neg'}">${money(r.profit,true)}</span></div>`).join(""):emptyMini()}</div></div>`;

  // this month
  const mk=new Date().toISOString().slice(0,7); let mInc=0,mExp=0;
  for(const t2 of state.transactions){ if(String(t2.date).slice(0,7)!==mk)continue; if(t2.type==="income")mInc+=+t2.amount||0; else mExp+=+t2.amount||0; }
  const mMax=Math.max(1,mInc,mExp);
  const monthCard=`<div class="card"><div class="card-h"><h2>${esc(L("this_month"))}</h2></div>
    <div style="padding:14px 20px 22px;display:flex;flex-direction:column;gap:18px">
      <div><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="brk-k" style="color:var(--ink-soft);font-weight:600;font-size:13px">${esc(L("income"))}</span><span class="amt pos">${money(mInc)}</span></div><div style="height:10px;border-radius:20px;background:var(--surface-3);overflow:hidden"><i style="display:block;height:100%;width:${mInc/mMax*100}%;background:var(--pos)"></i></div></div>
      <div><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--ink-soft);font-weight:600;font-size:13px">${esc(L("expenses"))}</span><span class="amt neg">${money(mExp)}</span></div><div style="height:10px;border-radius:20px;background:var(--surface-3);overflow:hidden"><i style="display:block;height:100%;width:${mExp/mMax*100}%;background:var(--neg)"></i></div></div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:700">${esc(L("net_profit"))}</span><span class="money ${mInc-mExp>=0?'pos':'neg'}">${money(mInc-mExp,true)}</span></div>
    </div></div>`;

  return dgrid+`<div class="grid3" style="margin-top:16px">${recentCard}${topCard}${monthCard}</div>`;
}
function emptyMini(){ return `<div class="empty" style="padding:26px 12px"><div class="eic">${I.folder}</div><p style="margin:0">${esc(L("no_activity"))}</p></div>`; }

function areaChart(){
  const months=[]; const now=new Date();
  for(let i=chartMonths-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:d.toISOString().slice(0,7),label:d.toLocaleDateString(lang==="ar"?"ar-EG":"en-US",{month:"short"})}); }
  const data=months.map(m=>{ let inc=0,exp=0; for(const t of state.transactions){ if(String(t.date).slice(0,7)!==m.key)continue; if(t.type==="income")inc+=+t.amount||0; else exp+=+t.amount||0;} return {...m,inc,exp}; });
  const W=640,H=210,padX=24,padT=18,padB=30;
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const n=data.length, plotW=W-padX*2, plotH=H-padT-padB;
  const X=i=>padX+(n<=1?plotW/2:plotW*i/(n-1));
  const Y=v=>padT+plotH-(v/max)*plotH;
  const incPts=data.map((d,i)=>[X(i),Y(d.inc)]), expPts=data.map((d,i)=>[X(i),Y(d.exp)]);
  const smooth=pts=>{ if(pts.length<2)return pts.length?`M${pts[0][0]},${pts[0][1]}`:""; let dd=`M${pts[0][0]},${pts[0][1]}`; for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;dd+=` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;} return dd; };
  const incLine=smooth(incPts), expLine=smooth(expPts);
  const baseY=padT+plotH;
  const area=incLine?`${incLine} L${X(n-1)},${baseY} L${X(0)},${baseY} Z`:"";
  const grid=[0,.5,1].map(f=>`<line x1="${padX}" x2="${W-padX}" y1="${padT+plotH*f}" y2="${padT+plotH*f}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`).join("");
  const labels=data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--on-dark-soft)" font-family="var(--font)">${esc(d.label)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="incg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8098c9" stop-opacity=".38"/><stop offset="1" stop-color="#8098c9" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path d="${area}" fill="url(#incg)"/>`:""}
    ${expLine?`<path d="${expLine}" fill="none" stroke="#c58a7f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${incLine?`<path d="${incLine}" fill="none" stroke="#8098c9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${incPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#0f0f14" stroke="#8098c9" stroke-width="2"/>`).join("")}
    ${labels}
  </svg>`;
}

/* ---------- clients ---------- */
function clientsView(){
  const q=filters.clientSearch.toLowerCase();
  let list=state.clients.filter(c=>!q||[c.name,c.company,c.phone,c.email].some(v=>String(v||"").toLowerCase().includes(q))).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const toolbar=`<div class="toolbar"><div class="search">${I.search}<input id="clientSearch" placeholder="${esc(L("search_clients"))}" value="${esc(filters.clientSearch)}"></div></div>`;
  if(!state.clients.length)return toolbar+emptyState("no_clients_h","no_clients_p",readOnly?"":`<button class="btn accent" onclick="openClient()">${I.plus}${esc(L("add_client"))}</button>`);
  const body=list.map(c=>{ const pc=state.projects.filter(p=>p.clientId===c.id).length; let billed=0; for(const t of state.transactions){if(t.clientId===c.id&&t.type==="income")billed+=+t.amount||0;}
    return `<tr><td><div class="cellflex"><span class="avatar">${esc(initials(c.name))}</span><div><div class="strong">${esc(c.name)}</div><div class="rowsub">${esc(c.company||"—")}</div></div></div></td>
      <td>${c.phone?esc(c.phone):'<span class="muted">—</span>'}${c.email?`<div class="rowsub">${esc(c.email)}</div>`:""}</td>
      <td class="r"><span class="tag">${pc} ${esc(L("projects_count"))}</span></td>
      <td class="r"><span class="money pos">${money(billed)}</span></td>
      <td class="r">${rowActions(`openClient('${c.id}')`,`confirmDel('clients','${c.id}')`)}</td></tr>`;}).join("");
  return toolbar+`<div class="card"><div class="wrap"><table><thead><tr><th>${esc(L("name"))}</th><th>${esc(L("phone"))}</th><th class="r">${esc(L("projects_count"))}</th><th class="r">${esc(L("billed"))}</th><th></th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}
/* ---------- projects ---------- */
function projectsView(){
  const q=filters.projSearch.toLowerCase();
  let list=state.projects.filter(p=>filters.projStatus==="all"||p.status===filters.projStatus).filter(p=>!q||[p.name,clientName(p.clientId)].some(v=>String(v||"").toLowerCase().includes(q))).sort((a,b)=>String(b.startDate||"").localeCompare(String(a.startDate||"")));
  const toolbar=`<div class="toolbar"><div class="search">${I.search}<input id="projSearch" placeholder="${esc(L("search_projects"))}" value="${esc(filters.projSearch)}"></div>
    <div class="seg"><button class="${filters.projStatus==='all'?'on':''}" onclick="setProjStatus('all')">${esc(L("all"))}</button>${STATUSES.map(s=>`<button class="${filters.projStatus===s?'on':''}" onclick="setProjStatus('${s}')">${esc(L("st_"+s))}</button>`).join("")}</div></div>`;
  if(!state.projects.length)return toolbar+emptyState("no_projects_h","no_projects_p",readOnly?"":`<button class="btn primary" onclick="openProject()">${I.plus}${esc(L("add_project"))}</button>`);
  const body=list.map(p=>{ const s=projStats(p.id),budget=+p.budget||0,pct=budget>0?Math.min(100,Math.round(s.inc/budget*100)):0,margin=s.inc>0?Math.round(s.profit/s.inc*100):0;
    return `<tr><td><div class="strong">${esc(p.name)}</div><div class="rowsub">${esc(clientName(p.clientId)||L("none"))} · ${fmtDate(p.startDate)}</div></td>
      <td><span class="pill ${p.status||'active'}">${esc(L("st_"+(p.status||"active")))}</span></td>
      <td class="r"><span class="money">${budget?money(budget):'—'}</span>${budget?`<div class="rowsub">${pct}% ${esc(L("collected"))}</div>`:""}</td>
      <td class="r"><span class="money pos">${money(s.inc)}</span></td>
      <td class="r"><span class="money neg">${money(s.exp)}</span></td>
      <td class="r"><span class="money ${s.profit>=0?'pos':'neg'}">${money(s.profit,true)}</span>${s.inc>0?`<div class="rowsub">${margin}% ${esc(L("margin"))}</div>`:""}</td>
      <td class="r">${rowActions(`openProject('${p.id}')`,`confirmDel('projects','${p.id}')`)}</td></tr>`;}).join("");
  return toolbar+`<div class="card"><div class="wrap"><table><thead><tr><th>${esc(L("project"))}</th><th>${esc(L("status"))}</th><th class="r">${esc(L("budget"))}</th><th class="r">${esc(L("received"))}</th><th class="r">${esc(L("spent"))}</th><th class="r">${esc(L("profit"))}</th><th></th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}
/* ---------- transactions ---------- */
function txView(type){
  const isInc=type==="income", key=isInc?"incSearch":"expSearch", q=filters[key].toLowerCase();
  let list=state.transactions.filter(t=>t.type===type).filter(t=>!q||[catLabel(t.category),t.description,projName(t.projectId),clientName(t.clientId)].some(v=>String(v||"").toLowerCase().includes(q))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const sum=list.reduce((a,t)=>a+(+t.amount||0),0);
  const toolbar=`<div class="toolbar"><div class="search">${I.search}<input id="${isInc?'incSearch':'expSearch'}" placeholder="${esc(L("search_tx"))}" value="${esc(filters[key])}"></div><div class="totaltag">${esc(L("total"))}: <span class="money ${isInc?'pos':'neg'}" style="margin-inline-start:6px">${money(sum)}</span></div></div>`;
  if(!list.length&&!filters[key])return toolbar+emptyState(isInc?"no_income_h":"no_expenses_h",isInc?"no_income_p":"no_expenses_p",readOnly?"":`<button class="btn ${isInc?'accent':'primary'}" onclick="openTx('${type}')">${I.plus}${esc(isInc?L("add_income"):L("add_expense"))}</button>`);
  const body=list.map(t=>{ const pn=projName(t.projectId),cn=clientName(t.clientId);
    return `<tr><td class="muted" style="white-space:nowrap">${fmtDate(t.date)}</td>
      <td><div class="strong">${esc(catLabel(t.category))}</div>${t.description?`<div class="rowsub">${esc(t.description)}</div>`:""}</td>
      <td>${pn?esc(pn):`<span class="muted">${esc(L("no_project"))}</span>`}${cn&&cn!==pn?`<div class="rowsub">${esc(cn)}</div>`:""}</td>
      <td class="r"><span class="money ${isInc?'pos':'neg'}">${money(t.amount)}</span></td>
      <td class="r">${rowActions(`openTx('${type}','${t.id}')`,`confirmDel('transactions','${t.id}')`)}</td></tr>`;}).join("");
  return toolbar+`<div class="card"><div class="wrap"><table><thead><tr><th>${esc(L("date"))}</th><th>${esc(L("category"))}</th><th>${esc(L("project"))}</th><th class="r">${esc(L("amount"))}</th><th></th></tr></thead><tbody>${body||`<tr><td colspan="5" class="empty">${esc(L("no_activity"))}</td></tr>`}</tbody></table></div></div>`;
}
function rowActions(edit,del){ if(readOnly)return""; return `<div style="display:inline-flex;gap:4px;justify-content:flex-end"><button class="close" style="width:32px;height:32px" onclick="${edit}" title="${esc(L("edit"))}">${I.edit}</button><button class="close danger" style="width:32px;height:32px" onclick="${del}" title="${esc(L("delete"))}">${I.trash}</button></div>`; }
function emptyState(h,p,cta){ return `<div class="card"><div class="empty"><div class="eic">${I.folder}</div><h3>${esc(L(h))}</h3><p>${esc(L(p))}</p>${cta||""}</div></div>`; }

/* ===================== modals ===================== */
function modalHost(){ return document.getElementById("modal-host"); }
function closeModal(){ modalHost().innerHTML=""; }
function shell(title,body){ return `<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">${I.x}</button></div><form id="mform" onsubmit="return false">${body}</form></div></div>`; }
function field(id,label,html){ return `<div class="field"><label for="${id}">${esc(label)}</label>${html}</div>`; }
function foot(lbl){ return `<div class="modal-f"><button type="button" class="btn" onclick="closeModal()">${esc(L("cancel"))}</button><button type="button" class="btn accent" id="mSubmit">${esc(lbl)}</button></div>`; }

function openClient(id){
  const c=id?state.clients.find(x=>x.id===id):{};
  modalHost().innerHTML=shell(id?L("edit_client"):L("add_client"),`<div class="modal-b">
    ${field("f_name",L("name")+" *",`<input id="f_name" required value="${esc(c.name||"")}">`)}
    ${field("f_company",L("company"),`<input id="f_company" value="${esc(c.company||"")}">`)}
    <div class="row2">${field("f_phone",L("phone"),`<input id="f_phone" value="${esc(c.phone||"")}">`)}${field("f_email",L("email"),`<input id="f_email" type="email" value="${esc(c.email||"")}">`)}</div>
    ${field("f_notes",L("notes"),`<textarea id="f_notes">${esc(c.notes||"")}</textarea>`)}</div>${foot(L("save"))}`);
  document.getElementById("f_name").focus();
  document.getElementById("mSubmit").onclick=async()=>{ const name=val("f_name"); if(!name)return shake("f_name");
    const d={name,company:val("f_company"),phone:val("f_phone"),email:val("f_email"),notes:val("f_notes"),updatedAt:new Date().toISOString()}; if(!id)d.createdAt=new Date().toISOString();
    await save(()=>id?setRec("clients",id,d):addRec("clients",d)); };
}
function openProject(id){
  const p=id?state.projects.find(x=>x.id===id):{status:"active",startDate:todayISO()};
  const cOpts=`<option value="">${esc(L("none"))}</option>`+state.clients.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(c=>`<option value="${c.id}" ${p.clientId===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
  const sOpts=STATUSES.map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${esc(L("st_"+s))}</option>`).join("");
  modalHost().innerHTML=shell(id?L("edit_project"):L("add_project"),`<div class="modal-b">
    ${field("f_name",L("name")+" *",`<input id="f_name" required value="${esc(p.name||"")}">`)}
    ${field("f_client",L("client"),`<select id="f_client">${cOpts}</select>`)}
    <div class="row2">${field("f_status",L("status"),`<select id="f_status">${sOpts}</select>`)}${field("f_budget",L("budget")+" ("+L("curr")+")",`<input id="f_budget" type="number" step="0.001" min="0" value="${p.budget!=null?esc(p.budget):""}">`)}</div>
    ${field("f_start",L("start_date"),`<input id="f_start" type="date" value="${esc(p.startDate||todayISO())}">`)}
    ${field("f_notes",L("notes"),`<textarea id="f_notes">${esc(p.notes||"")}</textarea>`)}</div>${foot(L("save"))}`);
  document.getElementById("f_name").focus();
  document.getElementById("mSubmit").onclick=async()=>{ const name=val("f_name"); if(!name)return shake("f_name");
    const d={name,clientId:val("f_client")||null,status:val("f_status"),budget:num("f_budget"),startDate:val("f_start"),notes:val("f_notes"),updatedAt:new Date().toISOString()}; if(!id)d.createdAt=new Date().toISOString();
    await save(()=>id?setRec("projects",id,d):addRec("projects",d)); };
}
function openTx(type,id){
  const isInc=type==="income", t=id?state.transactions.find(x=>x.id===id):{type,date:todayISO()};
  const cats=isInc?INCOME_CATS:EXPENSE_CATS;
  const catOpts=cats.map(c=>`<option value="${c}" ${t.category===c?"selected":""}>${esc(catLabel(c))}</option>`).join("");
  const pOpts=`<option value="">${esc(L("no_project"))}</option>`+state.projects.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>`<option value="${p.id}" ${t.projectId===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  modalHost().innerHTML=shell(id?(isInc?L("edit_income"):L("edit_expense")):(isInc?L("new_income"):L("new_expense")),`<div class="modal-b">
    <div class="row2">${field("f_amount",L("amount")+" ("+L("curr")+") *",`<input id="f_amount" type="number" step="0.001" min="0" required value="${t.amount!=null?esc(t.amount):""}">`)}${field("f_date",L("date"),`<input id="f_date" type="date" value="${esc(t.date||todayISO())}">`)}</div>
    <div class="row2">${field("f_cat",L("category"),`<select id="f_cat">${catOpts}</select>`)}${field("f_proj",L("project"),`<select id="f_proj">${pOpts}</select>`)}</div>
    ${field("f_desc",L("description"),`<input id="f_desc" value="${esc(t.description||"")}">`)}</div>${foot(L("save"))}`);
  document.getElementById("f_amount").focus();
  document.getElementById("mSubmit").onclick=async()=>{ const amount=num("f_amount"); if(!(amount>0))return shake("f_amount");
    const pid=val("f_proj")||null, proj=pid?state.projects.find(x=>x.id===pid):null;
    const d={type,amount,date:val("f_date")||todayISO(),category:val("f_cat"),projectId:pid,clientId:proj?proj.clientId||null:null,description:val("f_desc"),updatedAt:new Date().toISOString()}; if(!id)d.createdAt=new Date().toISOString();
    await save(()=>id?setRec("transactions",id,d):addRec("transactions",d)); };
}
function confirmDel(coll,id){
  modalHost().innerHTML=shell(L("delete"),`<div class="modal-b"><p style="margin:6px 0 4px;font-size:16px;font-weight:700">${esc(L("confirm_del"))}</p><p class="muted" style="margin:0">${esc(L("confirm_del_body"))}</p></div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">${esc(L("cancel"))}</button><button type="button" class="btn" id="mSubmit" style="background:var(--neg);border-color:var(--neg);color:#fff">${esc(L("delete"))}</button></div>`);
  document.getElementById("mSubmit").onclick=async()=>{ await save(()=>delRec(coll,id),L("deleted")); };
}
async function save(fn,msg){
  const b=document.getElementById("mSubmit"); if(b){b.disabled=true;b.style.opacity=".6";}
  try{ await fn(); closeModal(); toast(msg||L("saved")); }
  catch(e){ if(b){b.disabled=false;b.style.opacity="1";} if(e&&e.code==="invalid_argument"){readOnly=true;closeModal();render();toast(L("readonly_note"));} else toast((e&&e.message)||"Error"); }
}
function val(id){ const el=document.getElementById(id); return el?el.value.trim():""; }
function num(id){ const el=document.getElementById(id); const n=el?parseFloat(el.value):NaN; return isNaN(n)?0:n; }
function shake(id){ const el=document.getElementById(id); if(el){el.style.borderColor="var(--neg)";el.focus();} }

/* ===================== events ===================== */
function go(k){ view=k; render(); window.scrollTo(0,0); }
function setLang(l){ lang=l; try{localStorage.setItem("mizan_lang",l);}catch(e){} closeModal(); render(); }
function toggleTheme(){ theme=theme==="dark"?"light":"dark"; try{localStorage.setItem("mizan_theme",theme);}catch(e){} render(); }
function setMonths(m){ chartMonths=m; render(); }
function setProjStatus(s){ filters.projStatus=s; render(); }
function bindInputs(){
  [["clientSearch","clientSearch"],["projSearch","projSearch"],["incSearch","incSearch"],["expSearch","expSearch"]].forEach(([id,key])=>{
    const el=document.getElementById(id); if(el)el.oninput=()=>{ filters[key]=el.value; const p=el.selectionStart; render(); const e2=document.getElementById(id); if(e2){e2.focus(); try{e2.setSelectionRange(p,p);}catch(_){}} };
  });
}
let toastTimer;
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2400); }

/* ===================== boot ===================== */
render();
initStore();
</script>
